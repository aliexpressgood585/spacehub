# ===== Binance USDT-M Futures paper-trading bot configuration =====
mode: paper                  # paper only (live adapter intentionally not implemented)

symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT]

account:
  era: 2                      # higher than state.era archives the book once and starts over
  starting_balance: 100.0     # USDT. Do not raise this to reset a live book.
  margin_type: ISOLATED
  default_leverage: 10        # cap; size() still refuses a leverage the bracket does not allow
  risk_profile: aggressive    # the selector does not edit risk or leverage

fees:                         # Binance VIP0 USDT-M (no BNB discount)
  maker: 0.0002               # 0.02%
  taker: 0.0005               # 0.05%

execution:
  slippage_bps: 1.0           # extra adverse slippage on market/stop fills (1 bp = 0.01%)
  sl_tp_working_type: CONTRACT_PRICE   # CONTRACT_PRICE (last) or MARK_PRICE
  limit_fill_requires_trade_through: true

risk:
  # Aggressive paper profile. High chance of ruin is accepted. The regime
  # selector reads these numbers and does not rewrite them.
  risk_per_trade: 0.05        # 5% of equity at risk per trade (incl. est. round-trip fees)
  max_concurrent_positions: 4
  max_margin_per_position: 0.60   # a single position may use at most 60% of equity as margin
  max_daily_loss: 0.15        # stop opening new trades after -15% equity in a UTC day
  max_drawdown: 0.50          # hard halt of every new entry at 50% below peak equity
  max_open_risk: 0.15         # open risk-to-stop across positions, fraction of equity
  # Round a sub-minimum order up to min notional only inside this risk fraction.
  min_notional_roundup_risk: 0.07
  one_position_per_symbol: true

# Live book is the owner-selected short EMA + fade variant (regime_fast_mr in
# reports/regime_oos.json): ema_fast_4h on trending coins, bb_rsi_4h on ranging
# coins. ema_trend_4h stays the primary name so a deploy is not a history
# replay; the selector blocks its new entries. orb_ny_15m and xs_mom_1d stay
# off. Caps on a disabled row are unused. The five symbols below are the
# fallback when the monthly cache is missing. The scanner, when on, widens
# entries to the cached rank and does not edit this list.
# Manual baskets are off in config/manual_trades.json.
strategies:
  - name: ema_trend_4h
    enabled: true
    risk_per_trade: 0.05
    max_concurrent_positions: 4
    # New entries only. An open position on any other coin is still managed to its own exit.
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT]
  - name: orb_ny_15m
    enabled: false
    risk_per_trade: 0.005
    max_concurrent_positions: 2
    max_daily_loss: 0.02
  - name: xs_mom_1d
    enabled: false
    max_concurrent_positions: 8
    max_daily_loss: 0.02
  # 4h Bollinger/RSI fade. RANGE sleeve of the short-EMA book.
  # Same 5% risk and 4-position cap as the account. It does not add a cap.
  - name: bb_rsi_4h
    enabled: true
    risk_per_trade: 0.05
    max_concurrent_positions: 4
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT]
  # Shorter 4h EMA cross (10/40). TREND sleeve. Same stop and daily EMA50
  # filter as ema_trend_4h. It does not add a tighter risk cap.
  - name: ema_fast_4h
    enabled: true
    risk_per_trade: 0.05
    max_concurrent_positions: 4
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT]

# Closed-bar regime (BTC anchor + each traded coin). The OOS menu in
# reports/regime_oos.json leaves this off, because no switched book beat
# ema_trend_4h on return (short EMA + fade was +68.1% / -40.9% DD vs
# ema_trend_4h +146.9% / -27.2% DD, Jan-Oct 2026, $100, aggressive).
# The owner overrode that menu on 2026-10-25 and asked for the faster book.
# Turning this on does not change risk.*, leverage, or the era-2 balance.
regime_selector:
  enabled: true
  anchor: BTCUSDT
  timeframe: 4h
  min_dwell_bars: 6          # the committed label stays for 6 closed bars (24h)
  confirm_bars: 2            # the new label must then repeat twice; one spike does not flip
  adx_period: 14
  atr_period: 14
  atr_lookback: 90
  chaos_percentile: 0.90     # ATR% above 90% of the previous window (bar itself excluded)
  chaos_exit: 0.70           # leave CHAOS once ATR% falls out of the top 30%
  adx_trend_on: 25
  adx_trend_off: 20
  adx_range_on: 18
  adx_range_off: 23
  ema_period: 20
  slope_bars: 3
  slope_min: 0.0015          # |EMA change| / price over slope_bars, trend confirmation
  trend_strategy: ema_fast_4h
  range_strategy: bb_rsi_4h  # fade on RANGE. null would stand aside.
  dd_margin_pp: 2.0
  oos_start: "2026-01-01"
  demote:
    window_trades: 8
    window_days: 14
    min_trades: 4
    loss_frac: 0.04          # mean <= 0 and lost 4% of equity
    hard_loss_frac: 0.08     # or lost 8% of equity over at least 2 closes

# Ranks the desk's cached monthly universe. It does not call rank_live.
# enabled is the ship switch. reports/scanner_oos.json is the OOS gate:
# a liquidation or a drawdown deeper than 60% turns this off and the live
# book is the plain 5-coin short EMA + fade variant.
# 2026-10-25 one-pass OOS: scanner return -50.1%, max DD -50.6%, 2 liquidations,
# 0.20 trades/day. Gate failed. Plain 5-coin book ships. Do not flip this on
# without a new OOS file that passes the gate.
scanner:
  enabled: false
  top_n: 18
  cap: 20
  max_new_per_bar: 2
  per_coin: true             # TREND coins take ema_fast_4h, RANGE coins take bb_rsi_4h
  pullback: true             # fresh tag of EMA10 while 10/40 is already aligned
  pullback_hold_bars: 12     # 48h on pullback entries only; crosses keep the flip exit

strategy:
  name: ema_trend_4h          # ema_trend_4h | trend_ema | bollinger_mr | bb_rsi_4h | orb_ny_15m
  params:
    ema_trend_4h:
      timeframe: 1h          # strategy runs on each closed 1h bar
      signal_timeframe: 4h   # the cross itself is read from completed 4h bars
      ema_fast: 20
      ema_slow: 150
      atr_period: 20
      sl_atr: 3.0
      tp_atr: 0               # no take-profit; exit is the stop, the trail, or the opposite cross
      regime: self50          # longs only above the coin's daily EMA50, shorts only below
      leverage: 10
    ema_fast_4h:
      timeframe: 1h
      signal_timeframe: 4h
      ema_fast: 10           # shorter pair, precommitted, not fit on the OOS window
      ema_slow: 40
      atr_period: 20
      sl_atr: 3.0
      tp_atr: 0
      regime: self50
      leverage: 10
    orb_ny_15m:
      session: ny            # 09:30 America/New_York, DST via the zone database
      rng: 60                # opening range, minutes
      filt: both             # 1h EMA20/50 agrees with 4h EMA20/100
      slm: half              # stop at the range midpoint
      tpR: 2.0               # take-profit distance, in R
      win: 3                 # hours after the open in which a breakout may trigger (not bars)
      hold: 8                # time exit, hours after the session open (17:30 New York)
      maxw: 0                # 0 disables the range/ATR cap
      dow: wk                # weekdays only
      vreg: high             # daily ATR% above its 60-day median
      volf: 1.0              # last closed day's volume at least its 20-day median
      tstr: 0                # 0 disables the 4h trend-strength filter (falsy in the research code)
      timeframe: 15m
      leverage: 3
    xs_mom_1d:
      timeframe: 1d
      lb: 14                 # volatility-normalised return, days
      vol_win: 70
      reb_days: 3            # rebalance at 00:00 UTC when the Unix day index is divisible by 3.
                             # A flat book that has not entered the current period opens once from the last closed daily bar.
      k: 4                   # long the top 4, short the bottom 4
      gross: 0.30            # 30% of equity notional across all 8 legs (~3.75% each)
      disaster_sl_atr: 5.0   # wide stop; the research book had none
      leverage: 3
    trend_ema:
      timeframe: 15m
      trend_timeframe: 1h
      ema_fast: 20
      ema_slow: 50
      trend_ema: 200
      rsi_period: 14
      rsi_long_max: 70        # don't buy when RSI >= 70
      rsi_short_min: 30       # don't sell when RSI <= 30
      atr_period: 14
      sl_atr_mult: 2.0
      tp_atr_mult: 3.0
      leverage: 3
      exit_on_opposite_cross: false
    bollinger_mr:
      timeframe: 15m
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
      atr_period: 14
      sl_atr_mult: 1.5
      leverage: 3
    bb_rsi_4h:
      timeframe: 1h
      signal_timeframe: 4h
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
      atr_period: 14
      sl_atr: 1.5
      leverage: 10

data:
  history_bars: 600           # rolling window kept per timeframe; ema_trend_4h needs >= ~400 closed 4h bars
  # Endpoints are tried in order. fapi.binance.com returns HTTP 451 from GitHub-hosted
  # runners and from many other hosts; www.binance.com/fapi serves the same production
  # public market data. If both fail, bot/feed.py uses OKX USDT-SWAP candles and funding
  # and the dashboard says so. Fees and leverage brackets stay on the Binance schedule
  # (data/market_meta.json is the committed fallback for exchangeInfo + brackets).
  rest_bases: ["https://fapi.binance.com", "https://www.binance.com"]
  okx_base: "https://www.okx.com"
  brackets_url: "https://www.binance.com/bapi/futures/v1/friendly/future/common/brackets"
  ws_public: "wss://fstream.binance.com/public/stream"   # bookTicker
  ws_market: "wss://fstream.binance.com/market/stream"   # markPrice@1s, klines
  ws_legacy: "wss://fstream.binance.com/stream"

backtest:
  days: 90
  warmup_days: 12
  spread_bps: 1.0             # assumed full bid/ask spread in backtest (no historical book)
  out_dir: results

live:
  db_path: data/paper.db
  trades_csv: data/trades.csv
  status_file: data/status.json
  snapshot_file: data/live_snapshot.json
  log_file: logs/live.log
  status_interval_sec: 60
  equity_interval_sec: 60

dashboard:
  host: 0.0.0.0
  port: 8787
