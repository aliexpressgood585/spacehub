name: pmr-desk
# "פולי תגמולים": Polymarket LIQUIDITY-REWARDS PAPER desk ($1,000 demo on real books, real reward pools, real trade tape). LIVE
# LOOP: one job runs ~5h45m, running scripts/pmr-desk.ts every ~15 s and publishing pmr/state.json to the `pm-desk-data` branch.
# The hourly cron only restarts the loop when the previous job has ended (concurrency queue). Never places a real order.
on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
concurrency:
  group: pmr-desk
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: live loop
        run: |
          mkdir -p /tmp/desk/scripts /tmp/desk/shared
          cp scripts/pmr-desk.ts /tmp/desk/scripts/; cp shared/pmr.ts /tmp/desk/shared/
          git config user.name pm-desk-bot
          git config user.email actions@github.com
          git fetch -q origin pm-desk-data || true
          if git rev-parse --verify origin/pm-desk-data >/dev/null 2>&1; then
            git checkout -q -B pm-desk-data origin/pm-desk-data
          else
            git checkout -q --orphan pm-desk-data && git rm -rf -q . && git clean -fdq
          fi
          mkdir -p pmr
          end=$(( $(date +%s) + 345*60 )); last=0
          while [ $(date +%s) -lt $end ]; do
            t0=$(date +%s)
            timeout 120 node --experimental-strip-types /tmp/desk/scripts/pmr-desk.ts pmr/state.json || echo "cycle failed"
            if [ $(( t0 - last )) -ge 15 ]; then
              git add pmr/state.json
              if git commit -q -m "pmr desk state $(date -u +%FT%TZ)"; then
                git push -q origin pm-desk-data || { git pull -q --rebase -X ours origin pm-desk-data && git push -q origin pm-desk-data; } || true
              fi
              last=$t0
            fi
            s=$(( 15 - ($(date +%s) - t0) )); [ $s -gt 0 ] && sleep $s
          done
