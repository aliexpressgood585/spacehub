name: Long Short Grid 3Y Research
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/market-gate-check/long_short_grid.py'
      - 'scripts/market-gate-check/check_long_short_grid.py'
      - 'quant/PREREGISTRATION_LONG_SHORT_GRID.md'
      - '.github/workflows/long-short-grid-3y.yml'
  push:
    branches: [research/long-short-grid-20261007]
    paths:
      - 'scripts/market-gate-check/long_short_grid.py'
      - 'scripts/market-gate-check/check_long_short_grid.py'
      - 'quant/PREREGISTRATION_LONG_SHORT_GRID.md'
      - '.github/workflows/long-short-grid-3y.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.1.3 numba==0.61.0
      - working-directory: scripts/market-gate-check
        run: python check_long_short_grid.py
      - working-directory: scripts/market-gate-check
        run: python long_short_grid.py
      - uses: actions/upload-artifact@v4
        with:
          name: long-short-grid-3y
          path: scripts/market-gate-check/research-output/long-short-grid-3y.json
          retention-days: 30
