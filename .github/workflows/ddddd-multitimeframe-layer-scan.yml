name: DDDDD Multi-Timeframe Layer Scan
on:
  push:
    paths:
      - 'scripts/ddddd-multitimeframe-layer-scan.py'
      - '.github/workflows/ddddd-multitimeframe-layer-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scan 8-12 candle patterns on 10m across top-10
        run: |
          sed -i 's/for n in range(2,9):/for n in range(8,13):/' scripts/ddddd-multitimeframe-layer-scan.py
          python3 scripts/ddddd-multitimeframe-layer-scan.py
