name: DDDDD Multi-Timeframe Layer Scan
on:
  push:
    paths:
      - 'scripts/ddddd-multitimeframe-layer-scan.py'
      - '.github/workflows/ddddd-multitimeframe-layer-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scan top-10 across 1m 15m 30m 1h
        run: python3 scripts/ddddd-multitimeframe-layer-scan.py
