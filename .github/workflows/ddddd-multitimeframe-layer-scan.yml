name: DDDDD Multi-Timeframe Layer Scan
on:
  push:
    paths:
      - 'scripts/ddddd-multitimeframe-layer-scan.py'
      - '.github/workflows/ddddd-multitimeframe-layer-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Search robust 3y entry filters
        run: |
          python3 -m pip install --quiet numpy
          python3 scripts/search-3year-entry-filters.py
