name: Trade Journal Backup

on:
  push:
    paths:
      - '.github/workflows/trade-journal.yml'
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_REF: adxgadwghgkwmntsnrar

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Query live paper ledger
        shell: bash
        run: |
          Q="SELECT id,sym,side,strategy,entry_price,exit_price,size,risk_usd,pnl,pnl_pct,fee,status,exit_stage,opened_at,closed_at,lev,hi,lo,scalp_meta FROM bot_trades ORDER BY id;"
          jq -n --arg q "$Q" '{query:$q}' >/tmp/q.json
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"             -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}"             -H "Content-Type: application/json" --data @/tmp/q.json >/tmp/trades.raw.json

      - name: Export journal and analyse DDDDD
        shell: bash
        run: |
          mkdir -p status
          python3 - <<'PYEOF'
          import csv, json, time, urllib.request, urllib.parse
          from datetime import datetime, timezone

          def unwrap(x):
              if isinstance(x,list): return x
              if isinstance(x,dict):
                  for k in ('result','data','rows'):
                      v=x.get(k)
                      if isinstance(v,list): return v
                      if isinstance(v,str):
                          try:
                              y=json.loads(v)
                              if isinstance(y,list): return y
                          except Exception: pass
              raise SystemExit('unexpected Supabase response: '+repr(x)[:500])

          rows=unwrap(json.load(open('/tmp/trades.raw.json')))
          rows=[r for r in rows if isinstance(r,dict)]
          cols=['id','sym','side','strategy','entry_price','exit_price','size','risk_usd','pnl','pnl_pct','fee','status','exit_stage','opened_at','closed_at','lev']
          with open('status/trades-journal.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=cols,extrasaction='ignore'); w.writeheader()
              for r in rows: w.writerow(r)

          def fnum(x,default=0.0):
              try:return float(x)
              except:return default
          def iso_ms(s):
              if not s:return int(time.time()*1000)
              return int(datetime.fromisoformat(str(s).replace('Z','+00:00')).timestamp()*1000)
          def fetch_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':'spacehub-ddddd-analysis/1'})
              with urllib.request.urlopen(req,timeout=15) as r:return json.loads(r.read())
          def pair(sym):
              return ('1000PEPEUSDT',1000.0) if sym=='PEPE' else (sym+'USDT',1.0)
          def klines(sym,start,end):
              s,k=pair(sym); out=[]; cur=(start//60000)*60000
              while cur<=end and len(out)<6000:
                  lim=min(1000,max(1,int((end-cur)/60000)+2))
                  qs=urllib.parse.urlencode({'symbol':s,'interval':'1m','startTime':cur,'endTime':end,'limit':lim})
                  data=None
                  for base in ('https://fapi.binance.com/fapi/v1/klines','https://data-api.binance.vision/api/v3/klines'):
                      try:
                          data=fetch_json(base+'?'+qs)
                          if isinstance(data,list): break
                      except Exception: data=None
                  if not isinstance(data,list) or not data: break
                  batch=[]
                  for x in data:
                      try: batch.append((int(x[0]),float(x[1])/k,float(x[2])/k,float(x[3])/k,float(x[4])/k))
                      except Exception: pass
                  if not batch: break
                  out.extend(batch); nxt=batch[-1][0]+60000
                  if nxt<=cur: break
                  cur=nxt
                  if batch[-1][0]>=end-60000: break
              seen=set(); z=[]
              for x in out:
                  if x[0] not in seen: seen.add(x[0]); z.append(x)
              return z

          def sim_long(entry,bars,mode):
              base_stop=entry*0.99; activated=False; partial=False; highwater=entry
              qty=1.0; gross=0.0
              for ts,o,h,l,c in bars:
                  stop=base_stop
                  if mode!='BASE' and activated: stop=max(stop,entry*1.001)
                  if mode=='P06' and partial: stop=max(stop,highwater*(1-0.0035))
                  if l<=stop:
                      gross += qty*(stop-entry)/entry; qty=0; break
                  if mode!='BASE' and not activated and h>=entry*1.004: activated=True
                  if mode=='P06' and activated and not partial and h>=entry*1.006:
                      q=1/3; gross += q*0.006; qty-=q; partial=True; highwater=max(highwater,h)
                  if partial: highwater=max(highwater,h)
                  target=entry*(1.013 if mode=='P06' and partial else 1.01)
                  if h>=target:
                      gross += qty*(target-entry)/entry; qty=0; break
              if qty>0 and bars:
                  gross += qty*(bars[-1][4]-entry)/entry
              # 5bp entry + weighted 5bp exit ≈ 10bp notional round trip.
              return gross-0.001

          d5=[]
          for r in rows:
              m=r.get('scalp_meta') or {}
              q=(m.get('q15') or {}) if isinstance(m,dict) else {}
              if q.get('pattern')=='DDDDD': d5.append(r)
          closed=[r for r in d5 if r.get('status')!='OPEN']
          opened=[r for r in d5 if r.get('status')=='OPEN']
          rep={'generated_at':datetime.now(timezone.utc).isoformat(),'trades_total':len(rows),'ddddd_total':len(d5),'closed':len(closed),'open':len(opened),'rows':[]}
          sums={'BASE':0.0,'BE04':0.0,'P06':0.0}; usable=0
          for r in d5:
              entry=fnum(r.get('entry_price')); lev=max(1,fnum(r.get('lev'),25))
              start=iso_ms(r.get('opened_at')); end=iso_ms(r.get('closed_at')) if r.get('closed_at') else int(time.time()*1000)
              bars=[]
              try: bars=klines(str(r.get('sym')),start,min(end,start+72*3600*1000))
              except Exception: pass
              item={'id':r.get('id'),'sym':r.get('sym'),'status':r.get('status'),'entry':entry,'opened_at':r.get('opened_at'),'closed_at':r.get('closed_at'),'actual_pnl':fnum(r.get('pnl')),'actual_pnl_pct':fnum(r.get('pnl_pct')),'bars':len(bars)}
              if entry>0 and bars:
                  usable+=1
                  for mode,key in [('BASE','BASE'),('BE04','BE04'),('P06','P06')]:
                      v=sim_long(entry,bars,mode)*lev; item[key+'_rom']=v; sums[key]+=v
              rep['rows'].append(item)
          rep['usable_replays']=usable
          rep['estimated_avg_return_on_margin_pct']={k:round((v/usable*100 if usable else 0),4) for k,v in sums.items()}
          with open('status/ddddd-live-analysis.json','w') as f: json.dump(rep,f,indent=2)

          act=sum(fnum(r.get('pnl')) for r in closed); wins=sum(1 for r in closed if fnum(r.get('pnl'))>0)
          av=rep['estimated_avg_return_on_margin_pct']
          lines=['# DDDDD live analysis','',f"Generated: {rep['generated_at']}",f"- DDDDD trades: **{len(d5)}** — closed **{len(closed)}**, open **{len(opened)}**",f"- Actual closed P&L: **{act:.2f} USD**; wins **{wins}/{len(closed)}**" if closed else '- No DDDDD trade has closed yet.',f"- Replays with usable 1m market data: **{usable}**"]
          if usable:
              lines += [f"- Baseline 1%/1% est. avg net return on margin: **{av['BASE']:.3f}%**",f"- BE after +0.4% (BE+fees) est.: **{av['BE04']:.3f}%**",f"- 1/3 at +0.6%, BE+fees, 0.35% trail, 1.3% cap est.: **{av['P06']:.3f}%**",'','> Diagnostic replay uses conservative 1-minute OHLC ordering; it is not tick-perfect.']
          if opened:
              lines += ['','## Open DDDDD positions']+[f"- {r.get('sym')} entry {r.get('entry_price')} opened {r.get('opened_at')}" for r in opened[:50]]
          with open('status/ddddd-live-analysis.md','w') as f:f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PYEOF

      - name: Commit journal and DDDDD report
        run: |
          git config user.name "journal-bot"; git config user.email "actions@github.com"
          git add status/trades-journal.csv status/ddddd-live-analysis.json status/ddddd-live-analysis.md
          git commit -m "journal: refresh trades and DDDDD analysis [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push || echo "push failed (non-fatal)"
