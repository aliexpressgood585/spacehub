name: EMA200 RSI Sweep 5M
on:
  push:
    branches: ['research/ema200-rsi-sweep-5m-20261008']
    paths:
      - 'scripts/edge-hunt/ema200_rsi_sweep_5m.py'
      - '.github/workflows/ema200-rsi-sweep-5m.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy numba
      - run: python -m py_compile scripts/edge-hunt/ema200_rsi_sweep_5m.py
      - run: python scripts/edge-hunt/ema200_rsi_sweep_5m.py
      - name: Record result
        run: |
          cp research-output/ema200-rsi-sweep-5m-3y.json status/ema200-rsi-sweep-5m-3y-research.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/ema200-rsi-sweep-5m-3y-research.json
          git diff --cached --quiet || git commit -m "research: record EMA200 RSI sweep 5m result [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ema200-rsi-sweep-5m-3y
          path: research-output/
