name: All Futures Fast Edge 1m-5m
on:
  push:
    branches: ['research/allfutures-fast-edge-20261008']
    paths:
      - 'scripts/edge-hunt/allfutures_fast_edge.py'
      - '.github/workflows/allfutures-fast-edge.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy numba
      - run: python -m py_compile scripts/edge-hunt/allfutures_fast_edge.py
      - run: python scripts/edge-hunt/allfutures_fast_edge.py
      - name: Record result
        run: |
          cp research-output/allfutures-fast-edge-6m.json status/allfutures-fast-edge-6m-research.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/allfutures-fast-edge-6m-research.json
          git diff --cached --quiet || git commit -m "research: record all-futures fast-edge result [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: allfutures-fast-edge-6m
          path: research-output/
