name: DDDDD Green Confirmation 90D
on:
  push:
    paths: ['.github/workflows/ddddd-green-confirmation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Backtest all 59 demo symbols over 90 days
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,io,json,urllib.request,zipfile,concurrent.futures
          from datetime import datetime,timezone
          SYMS=["ALPINEUSDT","BBUSDT","ERAUSDT","WAXPUSDT","HYPERUSDT","FIDAUSDT","LUMIAUSDT","DODOXUSDT","BNBUSDT","ZECUSDT","ARKUSDT","WOOUSDT","FLUXUSDT","LAYERUSDT","LUNA2USDT","INUSDT","1000000MOGUSDT","AIOTUSDT","BATUSDT","REUSDT","POLYXUSDT","SHELLUSDT","ATHUSDT","WETUSDT","TUSDT","CATIUSDT","VELODROMEUSDT","AGTUSDT","ANKRUSDT","SUSHIUSDT","ATOMUSDT","FLUIDUSDT","BEAMXUSDT","ZESTUSDT","ASTRUSDT","PROMUSDT","VTHOUSDT","PROVEUSDT","WLDUSDT","LQTYUSDT","KAVAUSDT","ETHWUSDT","ORDERUSDT","BTRUSDT","ADAUSDT","C98USDT","HOTUSDT","THEUSDT","HIVEUSDT","DOGEUSDT","AUSDT","TRUMPUSDT","MIRAUSDT","EULUSDT","SOMIUSDT","ENSUSDT","AUCTIONUSDT","ZORAUSDT","HUSDT"]
          START=int(datetime(2026,7,8,tzinfo=timezone.utc).timestamp()*1000)
          END=int(datetime(2026,10,6,tzinfo=timezone.utc).timestamp()*1000)
          SPLIT=int(datetime(2026,9,6,tzinfo=timezone.utc).timestamp()*1000)
          BASE='https://data.binance.vision/data/futures/um'
          STEP=300000; COST=.001

          def get(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'spacehub-90d-confirm/1'})
                  with urllib.request.urlopen(req,timeout=25) as r: raw=r.read()
                  with zipfile.ZipFile(io.BytesIO(raw)) as z: txt=z.read(z.namelist()[0]).decode()
                  out=[]
                  for row in csv.reader(io.StringIO(txt)):
                      if row and row[0].isdigit():
                          t=int(row[0])
                          if START<=t<END: out.append((t,float(row[1]),float(row[2]),float(row[3]),float(row[4])))
                  return out
              except: return []

          def load(sym):
              us=[f'{BASE}/monthly/klines/{sym}/5m/{sym}-5m-2026-{m:02d}.zip' for m in (7,8,9)]
              us += [f'{BASE}/daily/klines/{sym}/5m/{sym}-5m-2026-10-{d:02d}.zip' for d in range(1,6)]
              a=[]
              for u in us:a+=get(u)
              a.sort()
              seen=set(); z=[]
              for x in a:
                  if x[0] not in seen:seen.add(x[0]);z.append(x)
              return z

          def outcome(bars,i,entry,be):
              stop0=entry*.99; target=entry*1.01; armed=False
              for j in range(i,len(bars)):
                  t,o,h,l,c=bars[j]
                  stop=max(stop0,entry*1.001) if armed else stop0
                  if l<=stop:return ((stop-entry)/entry-COST,'BE' if armed else 'SL',t)
                  if h>=target:return (.01-COST,'TP',t)
                  if be and not armed and h>=entry*1.004:armed=True
              return (None,'OPEN',None)

          def metrics(vals):
              v=[x[0] for x in vals if x[0] is not None]
              if not v:return {'n':0,'wr':0,'pf':0,'avg_pct':0,'net_pct':0}
              w=sum(x>0 for x in v); pos=sum(x for x in v if x>0); neg=-sum(x for x in v if x<0)
              return {'n':len(v),'wr':round(100*w/len(v),2),'pf':round(pos/neg,3) if neg else 999,
                      'avg_pct':round(100*sum(v)/len(v),4),'net_pct':round(100*sum(v),2)}

          def scan(sym):
              b=load(sym); rows=[]
              for i in range(5,len(b)):
                  five=b[i-5:i]
                  if any(five[k][0]!=five[0][0]+k*STEP for k in range(5)):continue
                  if not all(x[4]<x[1] for x in five):continue
                  sig=five[-1][0]+STEP
                  if i>=len(b) or b[i][0]!=sig:continue
                  green=None
                  for j in range(i,min(i+3,len(b))):
                      if b[j][0]!=sig+(j-i)*STEP:break
                      if b[j][4]>b[j][1]:green=j;break
                  rec={'t':sig,'confirmed':green is not None}
                  if green is not None and green+1<len(b) and b[green+1][0]==b[green][0]+STEP:
                      e=b[green][4]
                      rec['plain']=outcome(b,green+1,e,False)
                      rec['be']=outcome(b,green+1,e,True)
                  rows.append(rec)
              def pack(sel):
                  rr=[x for x in rows if sel(x)]
                  ex=[x for x in rr if x.get('confirmed') and 'be' in x]
                  return {'signals':len(rr),'confirmed':len(ex),'confirm_rate':round(100*len(ex)/len(rr),2) if rr else 0,
                          'plain':metrics([x['plain'] for x in ex]),'be':metrics([x['be'] for x in ex])}
              return {'symbol':sym,'bars':len(b),'all90':pack(lambda x:True),
                      'first60':pack(lambda x:x['t']<SPLIT),'last30':pack(lambda x:x['t']>=SPLIT)}

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              rs=list(ex.map(scan,SYMS))
          ranked=sorted(rs,key=lambda r:(r['all90']['be']['pf'],r['last30']['be']['pf'],r['all90']['be']['n']),reverse=True)
          print('RESULT_START')
          print(json.dumps(ranked,indent=2))
          print('RESULT_END')
          PY
