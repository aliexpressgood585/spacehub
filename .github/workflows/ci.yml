name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # `tsc --noEmit` used to stand here, and it checked nothing: the root
      # tsconfig is `files: []` plus project references, so without -b it has no
      # inputs and passes on any error. -b walks the referenced projects
      # (app, node, api) for real.
      - name: TypeScript check
        run: npx tsc -b --force
      # Site + serverless code only. The Deno trading-bot sources under
      # supabase/functions, backtest and trading-app carry their own backlog and
      # are linted separately, so they cannot mask a regression here.
      - name: Lint (site + API)
        run: npx eslint src api
      - name: Build
        run: npm run build
        env:
          VITE_ADSENSE_SLOT: ''
          VITE_SENTRY_DSN: ''
