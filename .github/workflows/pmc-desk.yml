name: pmc-desk
# "פולי מטבעות": Polymarket PAPER desk for the short crypto Up/Down markets ($1,000 demo on real prices). LIVE LOOP: one
# job runs for ~5h45m, running scripts/pmc-desk.ts every ~10 s and publishing pmc/state.json to the `pm-desk-data` branch.
# The hourly cron only restarts the loop when the previous job has ended (concurrency queue).
# Never places a real order.
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
concurrency:
  group: pmc-desk
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: live loop
        run: |
          mkdir -p /tmp/desk/scripts /tmp/desk/shared
          cp scripts/pmc-desk.ts /tmp/desk/scripts/; cp shared/pm.ts shared/pmc.ts shared/clv.ts /tmp/desk/shared/
          git config user.name pm-desk-bot
          git config user.email actions@github.com
          git fetch -q origin pm-desk-data || true
          if git rev-parse --verify origin/pm-desk-data >/dev/null 2>&1; then
            git checkout -q -B pm-desk-data origin/pm-desk-data
          else
            git checkout -q --orphan pm-desk-data && git rm -rf -q . && git clean -fdq
          fi
          mkdir -p pmc
          end=$(( $(date +%s) + 345*60 )); last=0
          while [ $(date +%s) -lt $end ]; do
            t0=$(date +%s)
            timeout 120 node --experimental-strip-types /tmp/desk/scripts/pmc-desk.ts pmc/state.json || echo "cycle failed"
            if [ $(( t0 - last )) -ge 10 ]; then
              git add pmc/state.json
              if git commit -q -m "pmc desk state $(date -u +%FT%TZ)"; then
                git push -q origin pm-desk-data || { git pull -q --rebase -X ours origin pm-desk-data && git push -q origin pm-desk-data; } || true
              fi
              last=$t0
            fi
            s=$(( 10 - ($(date +%s) - t0) )); [ $s -gt 0 ] && sleep $s
          done
