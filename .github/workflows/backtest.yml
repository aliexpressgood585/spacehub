name: Strategy Backtest

on:
  schedule:
    - cron: '0 6 1 * *'   # monthly edge-decay regression (1st of month, 06:00 UTC)
  # A push to backtest/.run-request runs whatever that file asks for. The repo
  # already uses this shape for status-ping, and it exists for the same reason:
  # a session without the GitHub connector cannot call workflow_dispatch, but it
  # can always commit a file. Format: one line, "MODE MONTHS" (months optional).
  push:
    branches: [main]          # branch syncs must not re-run the same request
    paths:
      - 'backtest/.run-request'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of history to backtest'
        required: false
        default: '45'
      mode:
        description: 'portfolio / signals / meanrev / explore / refine / validate / v76bt'
        required: false
        default: 'portfolio'
      months:
        description: 'Months of history (explore/refine/validate modes)'
        required: false
        default: '6'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mode (dispatch inputs, or backtest/.run-request on push)
        id: cfg
        run: |
          set -euo pipefail
          MODE='${{ github.event.inputs.mode }}'
          MONTHS='${{ github.event.inputs.months }}'
          if [ -z "$MODE" ] && [ -f backtest/.run-request ]; then
            # first non-comment, non-empty line: "MODE [MONTHS]"
            REQ=$(grep -vE '^\s*(#|$)' backtest/.run-request | head -1)
            MODE=$(echo "$REQ"  | awk '{print $1}')
            RM=$(echo  "$REQ"   | awk '{print $2}')
            [ -n "$RM" ] && MONTHS="$RM" || true
            echo "from .run-request: mode=$MODE months=$MONTHS"
          fi
          # fail closed: an unreadable request must not silently run the default
          if [ -z "$MODE" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::backtest/.run-request changed but no mode could be read from it"; exit 1
            fi
            MODE=freq
          fi
          [ -n "$MONTHS" ] || MONTHS=36
          echo "MODE=$MODE"     >> "$GITHUB_ENV"
          echo "MONTHS=$MONTHS" >> "$GITHUB_ENV"

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Download historical data (data.binance.vision)
        env:
          BT_DAYS: ${{ github.event.inputs.days || '45' }}
          BT_MONTHS: ${{ env.MONTHS }}
        run: |
          { [ "$MODE" = "v47bt" ] || [ "$MODE" = "v49bt" ]; } && export BT_FETCH_LIQ=1
          case "$MODE" in
            explore|refine|validate|range|freq|rota|v43bt|v44bt|v45bt|v46bt|v47bt|v48bt|v49bt|v50bt|v51bt|v52bt|v53bt|v54bt|v55bt|v56bt|v57bt|v58bt|v59bt|v60bt|v61bt|v62bt|v63bt|v64bt|v65bt|v66bt|v67bt|v68bt|v69bt|v70bt|v71bt|v72bt|v73bt|v74bt|v75bt|v76bt|v77bt|v78bt|v79bt|v80bt|v81bt|v82bt|v83bt|v84bt|v85bt|v86bt|v87bt|v88bt|v89bt|v90bt|v91bt|v92bt|v93bt|v94bt|v95bt|v96bt|v97bt|v98bt|v99bt|v100bt|v101bt|v102bt|v103bt|v104bt|v105bt) bash backtest/fetch-explore.sh ;;
            gym) bash backtest/binance-perps.sh; BT_MONTHS=$MONTHS bash backtest/fetch-5m.sh; BT_MONTHS=$MONTHS bash backtest/fetch-1h.sh ;;
            *) bash backtest/fetch.sh ;;
          esac
          { [ "$MODE" = "v74bt" ] || [ "$MODE" = "v75bt" ]; } && bash backtest/fetch-gold.sh || true
          [ "$MODE" = "v103bt" ] && bash backtest/fetch-bookdepth.sh || true
          { [ "$MODE" = "v76bt" ] || [ "$MODE" = "v99bt" ] || [ "$MODE" = "v100bt" ] || [ "$MODE" = "v101bt" ] || [ "$MODE" = "v102bt" ] || [ "$MODE" = "v103bt" ]; } && BT_MONTHS=12 bash backtest/fetch-5m.sh || true

      - name: Run backtest
        env:
          BT_MODE: ${{ env.MODE }}
        run: deno run --allow-read --allow-env --allow-write=status backtest/backtest.ts | tee /tmp/bt.log

      # Both entry points must land their result. The push path was added so a
      # session without the GitHub connector can still request a run; leaving the
      # commit gated on workflow_dispatch meant those runs executed the full
      # backtest and then threw the output away — the job went green, the result
      # was simply gone. Same failure family as the 45-day v78bt fetch: the run
      # reports success while producing nothing usable.
      - name: Commit result snapshot (dispatch + .run-request pushes)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          mkdir -p status
          { echo "backtest $(date -u +%Y-%m-%dT%H:%MZ) mode=$MODE months=$MONTHS"; tail -250 /tmp/bt.log; } > status/bt-latest.txt
          git config user.name "backtest-bot"; git config user.email "actions@github.com"
          git add status/bt-latest.txt
          git add status/gym-latest.json status/gym-latest.txt 2>/dev/null || true
          git commit -m "status: backtest result [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push || echo "push failed (non-fatal)"

      - name: Commit regression report (scheduled runs)
        if: github.event_name == 'schedule'
        run: |
          mkdir -p status
          { echo "monthly regression $(date -u +%Y-%m-%d) mode=$MODE months=$MONTHS"; tail -60 /tmp/bt.log; } > status/regression.txt
          git config user.name "regression-bot"; git config user.email "actions@github.com"
          git add status/regression.txt
          git commit -m "status: monthly edge regression [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push || echo "push failed (non-fatal)" 
