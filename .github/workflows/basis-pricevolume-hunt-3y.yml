name: Basis Price-Volume Hunt 3Y
on:
  push:
    branches: ['research/edge-hunt-20261007']
    paths:
      - 'scripts/edge-hunt/basis_pricevolume_hunt.py'
      - '.github/workflows/basis-pricevolume-hunt-3y.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy
      - run: python -m py_compile scripts/edge-hunt/basis_pricevolume_hunt.py
      - run: python scripts/edge-hunt/basis_pricevolume_hunt.py
      - name: Record result
        run: |
          mkdir -p status
          cp research-output/basis-pricevolume-hunt-3y.json status/basis-pricevolume-hunt-3y-research.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/basis-pricevolume-hunt-3y-research.json
          git diff --cached --quiet || git commit -m "research: record basis price-volume hunt [skip ci]"
          git pull --rebase origin research/edge-hunt-20261007
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: basis-pricevolume-hunt-3y
          path: research-output/
