name: BTC RSI Gate 3Y

on:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest-btc-rsi-gate-3y.py'
      - '.github/workflows/btc-rsi-gate-3y.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: pip install -q numpy
      - name: Run 3y BTC RSI gate test
        run: python scripts/backtest-btc-rsi-gate-3y.py | tee /tmp/btc-rsi.log
      - name: Commit result
        run: |
          git config user.name "analysis-bot"
          git config user.email "actions@github.com"
          git add status/btc-rsi-gate-3y.json
          git commit -m "status: BTC RSI gate 3y result [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push || echo "push failed"
