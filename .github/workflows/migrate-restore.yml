name: Migrate — restore snapshot into new project

# One-shot: replays migration/export/*.json into a fresh Supabase project.
# Runs here (not from a dev machine) so SUPABASE_ACCESS_TOKEN never leaves the
# GitHub secret store. Safe to re-run: every INSERT is ON CONFLICT DO NOTHING.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Target Supabase project ref (the NEW project)'
        required: true
      confirm:
        description: 'Type RESTORE to confirm writing into that project'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Guard
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RESTORE" ]; then
            echo "::error::confirm must be exactly RESTORE"; exit 1
          fi
          echo "target: ${{ github.event.inputs.project_ref }}"

      - name: Verify target is reachable and schema exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ github.event.inputs.project_ref }}
        run: |
          out=$(curl -s -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT to_regclass('"'"'public.bot_trades'"'"') AS bot_trades, to_regclass('"'"'public.bot_equity'"'"') AS bot_equity;"}')
          echo "$out"
          echo "$out" | grep -q '"bot_trades":null' && {
            echo "::error::schema missing — run Deploy Edge Function against this project first"; exit 1; }
          echo "schema present"

      - name: Restore rows
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ github.event.inputs.project_ref }}
        run: python3 migration/import.py
