name: Cross Sectional Grid 3Y Research
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/market-gate-check/cross_sectional_grid.py'
      - 'scripts/market-gate-check/check_cross_sectional_grid.py'
      - 'quant/PREREGISTRATION_CROSS_SECTIONAL.md'
      - '.github/workflows/cross-sectional-grid-3y.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.1.3
      - working-directory: scripts/market-gate-check
        run: python check_cross_sectional_grid.py
      - working-directory: scripts/market-gate-check
        run: python cross_sectional_grid.py
      - uses: actions/upload-artifact@v4
        with:
          name: cross-sectional-grid-3y
          path: scripts/market-gate-check/research-output/cross-sectional-grid-3y.json
          retention-days: 30
