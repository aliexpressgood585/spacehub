name: Public market data sample
on:
  workflow_dispatch:
  push:
    branches: [main, codex/public-market-recorder]
    paths:
      - scripts/collect-market-data.py
      - .github/workflows/market-data.yml
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recorder dependency
        run: python -m pip install websockets==16.0
      - name: Collect 90 seconds of public data
        shell: bash
        run: |
          mkdir -p capture
          set +e
          timeout --signal=INT --kill-after=10s 90s python -u scripts/collect-market-data.py --db capture/market.sqlite
          result=$?
          set -e
          if [ "$result" != 0 ] && [ "$result" != 124 ]; then exit "$result"; fi
      - name: Verify data actually arrived
        run: |
          python - <<'PY'
          import json, sqlite3
          db = sqlite3.connect('capture/market.sqlite')
          rows = db.execute("SELECT topic, COUNT(*) FROM events GROUP BY topic").fetchall()
          market = sum(n for topic, n in rows if not topic.startswith('_'))
          controls = db.execute("SELECT payload FROM events WHERE topic='_control'").fetchall()
          accepted = {json.loads(p).get('req_id') for (p,) in controls
                      if json.loads(p).get('op') == 'subscribe' and json.loads(p).get('success') is True}
          rejected = [json.loads(p) for (p,) in controls
                      if json.loads(p).get('op') == 'subscribe' and json.loads(p).get('success') is not True]
          print(json.dumps({'market_messages':market,'accepted_symbols':len(accepted),'topics':rows}))
          # No liquidations during a short sample is valid. Missing subscriptions is not.
          assert market > 0, 'No public market data received'
          assert len(accepted) == 40 and not rejected, 'Incomplete universe subscription'
          db.close()
          PY
      - name: Save sample (including failure evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-market-${{ github.run_id }}
          path: capture/
          retention-days: 7
          if-no-files-found: warn
