name: binance-paper-desk
# Binance USDT-M futures PAPER desk. One job loops for ~5h45m (under the 6h limit):
# every wall-clock minute replays closed 1m bars for stops / liquidation / funding,
# and a full strategy cycle runs about two minutes after each 1h close. State is
# committed to `pm-desk-data` at least every 5 minutes and immediately on an account
# event. The hourly cron, a push to main, and workflow_dispatch only start a loop;
# if one is already running the new job exits without chaining. At the end the job
# dispatches its own successor, so the desk stays up when the schedule does not fire.
# A tick that runs past 90s is killed and the loop continues. Git and gh calls
# die after 30s. If no push has landed for 10 minutes the loop exits non-zero
# and the chain step (if: always()) starts a successor. The loop step itself
# is capped so a stuck shell still reaches that step.
# The existing binance-paper/state.json is loaded and updated. An existing account
# is never replaced. Never places a real order and needs no API keys.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binance-paper-desk.yml'
      - 'binance-paper-bot/**'
concurrency:
  group: binance-paper-desk
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: python -m pip install --disable-pip-version-check -q numpy pyyaml requests
      - name: loop
        id: loop
        timeout-minutes: 350
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/desk
          rm -rf /tmp/desk/binance-paper-bot
          cp -a binance-paper-bot /tmp/desk/binance-paper-bot
          # shellcheck disable=SC1091
          source /tmp/desk/binance-paper-bot/scripts/desk_loop.sh
          # Captured before the state branch checkout. HEAD here is the ref this job started from.
          START_SHA=$(git rev-parse HEAD)
          git config user.name pm-desk-bot
          git config user.email actions@github.com
          # A failed fetch must not look like a missing branch: the orphan
          # path would start a second book and then fail to push it.
          set +e
          git_t fetch -q origin pm-desk-data
          fetch_rc=$?
          set -e
          if [ "$fetch_rc" -ne 0 ]; then
            echo "fetch pm-desk-data failed rc=$fetch_rc; not creating an empty book"
            exit 1
          fi
          if git rev-parse --verify origin/pm-desk-data >/dev/null 2>&1; then
            git checkout -q -B pm-desk-data origin/pm-desk-data
          else
            git checkout -q --orphan pm-desk-data && git rm -rf -q . && git clean -fdq
          fi
          mkdir -p binance-paper
          export PYTHONPATH=/tmp/desk/binance-paper-bot
          export DESK_RUN_ID="${GITHUB_RUN_ID}"

          # Concurrency already allows one running job and one pending. This exits
          # a second in-progress run without writing and without chaining.
          others=0
          set +e
          ids=$(gh_t run list --workflow binance-paper-desk.yml --status in_progress --limit 20 --json databaseId 2>/tmp/gh-runs.err)
          gh_rc=$?
          set -e
          if [ "$gh_rc" -ne 0 ]; then
            echo "gh run list failed; the heartbeat decides"
            cat /tmp/gh-runs.err || true
          else
            others=$(printf '%s' "$ids" | python -c 'import json,os,sys; raw=sys.stdin.read().strip(); rows=json.loads(raw) if raw else []; me=int(os.environ["GITHUB_RUN_ID"]); print(sum(1 for r in rows if int(r["databaseId"]) != me))')
            export DESK_LIVE_RUNS=$(printf '%s' "$ids" | python -c 'import json,sys; raw=sys.stdin.read().strip(); rows=json.loads(raw) if raw else []; print(",".join(str(int(r["databaseId"])) for r in rows))')
          fi
          if [ "${others:-0}" != "0" ]; then
            echo "another loop is in progress (${others}); exiting"
            echo "chain=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python -m bot.desk --check-loop binance-paper/state.json; then
            echo "heartbeat says another loop is running; exiting"
            echo "chain=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "chain=yes" >> "$GITHUB_OUTPUT"

          publish_if_ahead() {
            if git rev-parse --verify origin/pm-desk-data >/dev/null 2>&1 \
              && [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/pm-desk-data)" ]; then
              return 0
            fi
            push_state
          }
          handoff() {
            timeout --kill-after=10s 30s python -m bot.desk --handoff binance-paper/state.json || true
            if [ -f binance-paper/state.json ]; then
              git add binance-paper/state.json || true
              if ! git diff --cached --quiet; then
                git commit -q -m "binance paper desk handoff $(date -u +%FT%TZ) [skip ci]" || true
              fi
              n=0
              while [ "$n" -lt 2 ]; do
                publish_if_ahead && return 0
                n=$((n + 1))
                sleep $((n * 2))
              done
            fi
            return 0
          }
          handoff_once() {
            [ "${HANDOFF_DONE:-0}" = 1 ] && return 0
            HANDOFF_DONE=1
            handoff
          }
          trap 'handoff_once; exit 0' TERM INT
          trap handoff_once EXIT

          end=$(( $(date +%s) + 345*60 ))
          last_commit=0
          last_publish=$(date +%s)
          while [ "$(date +%s)" -lt "$end" ]; do
            remote=""
            set +e
            remote=$(git_t ls-remote origin refs/heads/main 2>/dev/null | awk 'NR==1{print $1}')
            set -e
            if [ -n "${remote}" ] && [ "$remote" != "$START_SHA" ]; then
              echo "main moved ${START_SHA} -> ${remote}; handing off so the successor loads it"
              exit 0
            fi
            now=$(date +%s)
            next=$(( (now / 60 + 1) * 60 ))
            if [ "$next" -ge "$end" ]; then
              break
            fi
            sleep_for=$(( next - now ))
            if [ "$sleep_for" -gt 0 ]; then
              sleep "$sleep_for"
            fi
            if [ "$(date +%s)" -ge "$end" ]; then
              break
            fi
            set +e
            out=$(timeout --kill-after=15s 90s python -u -m bot.desk --tick binance-paper/state.json 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              echo "tick failed rc=$rc; aborting this tick and continuing"
            else
              commit_now=0
              if printf '%s\n' "$out" | grep -q 'commit=yes'; then
                commit_now=1
              fi
              now_s=$(date +%s)
              if [ "$commit_now" -eq 1 ] || [ $((now_s - last_commit)) -ge 300 ]; then
                python -c 'import json; st=json.load(open("binance-paper/state.json")); assert st["paper"] is True and st["live_trading"] is False; loop=st.get("loop") or {}; print("equity=%.2f mode=%s wallet=%.2f positions=%d" % (st["equity"], loop.get("mode"), st["wallet"], len(st["positions"])))'
                git add binance-paper/state.json
                if git diff --cached --quiet; then
                  echo "no state change"
                else
                  git commit -q -m "binance paper desk state $(date -u +%FT%TZ) [skip ci]"
                fi
                last_commit=$now_s
              fi
            fi
            # A price-only minute does not create a new commit. Reset the
            # watchdog only when origin actually has our HEAD. Ten minutes
            # without that exits non-zero so the chain step starts a successor.
            now_s=$(date +%s)
            if publish_if_ahead; then
              last_publish=$now_s
            else
              echo "push failed; will retry"
              if publish_stale "$now_s" "$last_publish"; then
                echo "no successful publish for ${PUBLISH_STALE_S}s; exiting so the successor starts"
                exit 1
              fi
            fi
          done
      - name: chain successor
        if: always()
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # chain=no means this job already saw another live loop and stepped
          # aside. Dispatching again would queue a successor on every overlap.
          # Any other outcome (yes, empty, killed before the guard) starts one.
          if [ "${{ steps.loop.outputs.chain }}" = "no" ]; then
            echo "not chaining; another loop is alive"
            exit 0
          fi
          timeout --kill-after=10s 30s gh workflow run binance-paper-desk.yml --ref main
