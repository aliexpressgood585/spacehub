name: binance-paper-desk
# Binance USDT-M futures PAPER desk. One job loops for ~5h45m (under the 6h limit):
# every wall-clock minute replays closed 1m bars for stops / liquidation / funding,
# and a full strategy cycle runs about two minutes after each 1h close. State is
# committed to `pm-desk-data` at least every 5 minutes and immediately on an account
# event. The hourly cron, a push to main, and workflow_dispatch only start a loop;
# if one is already running the new job exits without chaining. At the end the job
# dispatches its own successor, so the desk stays up when the schedule does not fire.
# The existing binance-paper/state.json is loaded and updated. An existing account
# is never replaced. Never places a real order and needs no API keys.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binance-paper-desk.yml'
      - 'binance-paper-bot/**'
concurrency:
  group: binance-paper-desk
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: python -m pip install --disable-pip-version-check -q numpy pyyaml requests
      - name: loop
        id: loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/desk
          rm -rf /tmp/desk/binance-paper-bot
          cp -a binance-paper-bot /tmp/desk/binance-paper-bot
          git config user.name pm-desk-bot
          git config user.email actions@github.com
          git fetch -q origin pm-desk-data || true
          if git rev-parse --verify origin/pm-desk-data >/dev/null 2>&1; then
            git checkout -q -B pm-desk-data origin/pm-desk-data
          else
            git checkout -q --orphan pm-desk-data && git rm -rf -q . && git clean -fdq
          fi
          mkdir -p binance-paper
          export PYTHONPATH=/tmp/desk/binance-paper-bot
          export DESK_RUN_ID="${GITHUB_RUN_ID}"

          push_state() {
            git push -q origin pm-desk-data || { git pull -q --rebase -X ours origin pm-desk-data && git push -q origin pm-desk-data; }
          }

          # Concurrency already allows one running job and one pending. This exits
          # a second in-progress run without writing and without chaining.
          others=0
          set +e
          ids=$(gh run list --workflow binance-paper-desk.yml --status in_progress --limit 20 --json databaseId 2>/tmp/gh-runs.err)
          gh_rc=$?
          set -e
          if [ "$gh_rc" -ne 0 ]; then
            echo "gh run list failed; the heartbeat decides"
            cat /tmp/gh-runs.err || true
          else
            others=$(printf '%s' "$ids" | python -c 'import json,os,sys; raw=sys.stdin.read().strip(); rows=json.loads(raw) if raw else []; me=int(os.environ["GITHUB_RUN_ID"]); print(sum(1 for r in rows if int(r["databaseId"]) != me))')
          fi
          if [ "${others:-0}" != "0" ]; then
            echo "another loop is in progress (${others}); exiting"
            echo "chain=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python -m bot.desk --check-loop binance-paper/state.json; then
            echo "heartbeat says another loop is running; exiting"
            echo "chain=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "chain=yes" >> "$GITHUB_OUTPUT"

          publish_if_ahead() {
            if git rev-parse --verify origin/pm-desk-data >/dev/null 2>&1 \
              && [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/pm-desk-data)" ]; then
              return 0
            fi
            push_state
          }
          handoff() {
            python -m bot.desk --handoff binance-paper/state.json || true
            if [ -f binance-paper/state.json ]; then
              git add binance-paper/state.json || true
              if ! git diff --cached --quiet; then
                git commit -q -m "binance paper desk handoff $(date -u +%FT%TZ) [skip ci]" || true
              fi
              n=0
              while [ "$n" -lt 4 ]; do
                publish_if_ahead && return 0
                n=$((n + 1))
                sleep $((n * 2))
              done
            fi
            return 0
          }
          trap handoff EXIT

          end=$(( $(date +%s) + 345*60 ))
          last_commit=0
          while [ "$(date +%s)" -lt "$end" ]; do
            now=$(date +%s)
            next=$(( (now / 60 + 1) * 60 ))
            if [ "$next" -ge "$end" ]; then
              break
            fi
            sleep_for=$(( next - now ))
            if [ "$sleep_for" -gt 0 ]; then
              sleep "$sleep_for"
            fi
            if [ "$(date +%s)" -ge "$end" ]; then
              break
            fi
            set +e
            out=$(timeout 240 python -u -m bot.desk --tick binance-paper/state.json 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              echo "tick failed rc=$rc"
              continue
            fi
            commit_now=0
            if printf '%s\n' "$out" | grep -q 'commit=yes'; then
              commit_now=1
            fi
            now_s=$(date +%s)
            if [ "$commit_now" -eq 1 ] || [ $((now_s - last_commit)) -ge 300 ]; then
              python -c 'import json; st=json.load(open("binance-paper/state.json")); assert st["paper"] is True and st["live_trading"] is False; loop=st.get("loop") or {}; print("equity=%.2f mode=%s wallet=%.2f positions=%d" % (st["equity"], loop.get("mode"), st["wallet"], len(st["positions"])))'
              git add binance-paper/state.json
              if git diff --cached --quiet; then
                echo "no state change"
              else
                git commit -q -m "binance paper desk state $(date -u +%FT%TZ) [skip ci]"
              fi
              last_commit=$now_s
            fi
            # Retry a commit that was made but not pushed. A price-only minute does not
            # create a new commit, and an unchanged HEAD matches origin.
            publish_if_ahead || echo "push failed; will retry"
          done
      - name: chain successor
        if: always() && steps.loop.outputs.chain == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run binance-paper-desk.yml --ref main
