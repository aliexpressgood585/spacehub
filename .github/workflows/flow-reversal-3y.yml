name: DDDDD Exhaustion and Taker Flow 3Y
on:
  push:
    branches: ['research/flow-reversal-20261007']
    paths: ['scripts/market-gate-check/flow_reversal.py', 'scripts/market-gate-check/check_flow.py', '.github/workflows/flow-reversal-3y.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy numba
      - run: python scripts/market-gate-check/check_flow.py
      - run: python scripts/market-gate-check/flow_reversal.py
      - uses: actions/upload-artifact@v4
        with:
          name: flow-reversal-3y
          path: research-output/
