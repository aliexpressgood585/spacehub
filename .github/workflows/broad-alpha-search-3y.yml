name: Broad Alpha Search 3Y
on:
  push:
    branches: ['research/broad-alpha-search-20261007']
    paths:
      - 'scripts/market-gate-check/broad_alpha_search.py'
      - '.github/workflows/broad-alpha-search-3y.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy numba
      - run: python -m py_compile scripts/market-gate-check/broad_alpha_search.py
      - run: python scripts/market-gate-check/broad_alpha_search.py
      - name: Record result on research branch
        run: |
          cp research-output/broad-alpha-search-3y.json status/broad-alpha-search-3y-research.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/broad-alpha-search-3y-research.json
          git diff --cached --quiet || git commit -m "research: record broad alpha search [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: broad-alpha-search-3y
          path: research-output/
