name: Cross Section OI Funding Basis
on:
  push:
    branches: ['research/crosssection-oi-funding-basis-20261008']
    paths:
      - 'scripts/edge-hunt/crosssection_oi_funding_basis.py'
      - '.github/workflows/crosssection-oi-funding-basis.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy numba
      - run: python -m py_compile scripts/edge-hunt/crosssection_oi_funding_basis.py
      - run: python scripts/edge-hunt/crosssection_oi_funding_basis.py
      - name: Record result
        run: |
          cp research-output/crosssection-oi-funding-basis.json status/crosssection-oi-funding-basis-research.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/crosssection-oi-funding-basis-research.json
          git diff --cached --quiet || git commit -m "research: record cross-section OI funding basis result [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: crosssection-oi-funding-basis
          path: research-output/
