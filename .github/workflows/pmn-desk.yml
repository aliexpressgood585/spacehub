name: pmn-desk
# "פולי חדשות" (Poly News): Polymarket PAPER desk that trades only markets a fresh news post points at ($1,000 demo on real
# prices, separate account). LIVE LOOP: one job runs for ~5h45m, running scripts/pmn-desk.ts every ~15 s and publishing
# pmn/state.json to the `pm-desk-data` branch. The hourly cron only restarts the loop when the previous job has ended.
# Never places a real order.
on:
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:
concurrency:
  group: pmn-desk
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: live loop
        run: |
          mkdir -p /tmp/desk/scripts /tmp/desk/shared /tmp/pmn-cache
          cp scripts/pmn-desk.ts /tmp/desk/scripts/; cp shared/pm.ts shared/pmn.ts shared/clv.ts /tmp/desk/shared/
          git config user.name pm-desk-bot
          git config user.email actions@github.com
          # Depth 1: a full fetch of pm-desk-data walks every desk's history
          # and hangs a depth-1 checkout of main. A failed fetch must not
          # fall through into an empty orphan book.
          fetch_ok=0
          for attempt in 1 2 3; do
            if timeout --kill-after=10s 120s git fetch -q --depth=1 origin pm-desk-data; then
              fetch_ok=1
              break
            fi
            echo "fetch pm-desk-data attempt ${attempt}/3 failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done
          if [ "$fetch_ok" -ne 1 ] || ! git rev-parse --verify origin/pm-desk-data >/dev/null 2>&1; then
            echo "::error::pmn desk: fetch pm-desk-data failed; not creating an empty book"
            exit 1
          fi
          git checkout -q -B pm-desk-data origin/pm-desk-data
          mkdir -p pmn
          end=$(( $(date +%s) + 345*60 ))
          while [ $(date +%s) -lt $end ]; do
            t0=$(date +%s)
            timeout 150 node --experimental-strip-types /tmp/desk/scripts/pmn-desk.ts pmn/state.json /tmp/pmn-cache || echo "cycle failed"
            git add pmn/state.json
            if git commit -q -m "pmn desk state $(date -u +%FT%TZ)"; then
              # pull --rebase on this shallow branch drops our commit when
              # pmn/state.json also moved on origin. Fetch the tip and put
              # back only pmn/.
              ok=0
              for n in 1 2 3 4 5 6; do
                if timeout --kill-after=10s 60s git push -q origin pm-desk-data; then ok=1; break; fi
                sleep $(( (RANDOM % 4) + n ))
                ours=$(git rev-parse HEAD)
                if timeout --kill-after=10s 90s git fetch -q --depth=1 origin pm-desk-data; then
                  git reset -q --hard origin/pm-desk-data
                  if git checkout "$ours" -- pmn; then
                    git diff --cached --quiet || git commit -q -m "pmn desk state $(date -u +%FT%TZ)"
                  else
                    git reset -q --hard "$ours"
                  fi
                fi
              done
              [ "$ok" -eq 1 ] || echo "::error::pmn desk: state push to pm-desk-data failed after 6 attempts"
            fi
            s=$(( 15 - ($(date +%s) - t0) )); [ $s -gt 0 ] && sleep $s
          done
