name: Deploy Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'shared/**'
      - 'scripts/smoke-paper-bot.py'
      - '.github/workflows/deploy-edge-function.yml'
      - '.github/workflows/enforce-no-loss-trading.yml'
      - 'scripts/build-ledger-payload.py'
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: spacehub-paper-deploy
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_REF: adxgadwghgkwmntsnrar

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        id: clisetup
        continue-on-error: true
        with:
          version: latest

      - uses: supabase/setup-cli@v1
        if: steps.clisetup.outcome == 'failure'
        with:
          version: latest

      - name: Login to Supabase
        run: supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link project
        run: supabase link --project-ref ${{ env.PROJECT_REF }}

      - name: Remove unused crons
        run: |
          for JOB in 'bot-v18-every-minute' 'market-regime' 'portfolio-rebalancer'; do
            curl -s -X POST \
              "https://api.supabase.com/v1/projects/${{ env.PROJECT_REF }}/database/query" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"SELECT cron.unschedule(jobid) FROM cron.job WHERE jobname = '${JOB}';\"}" \
              && echo "Removed: ${JOB}" || echo "Not found (ok): ${JOB}"
          done

      - name: Run SQL migrations via management API
        run: |
          curl -s -X POST \
            "https://api.supabase.com/v1/projects/${{ env.PROJECT_REF }}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "SELECT 1"
            }' | tee /tmp/migration_result.json
          echo "Migration ping ok"

      - name: Apply ledger upgrade atomically
        run: |
          python3 scripts/build-ledger-payload.py > /tmp/ledger.json
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${{ env.PROJECT_REF }}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" \
            --data @/tmp/ledger.json > /tmp/ledger-result.json
          jq -e 'type == "array"' /tmp/ledger-result.json >/dev/null || { cat /tmp/ledger-result.json; exit 1; }
          echo "Ledger transaction committed"

      - name: Set optimizer secrets
        run: |
          supabase secrets set \
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
            --project-ref ${{ env.PROJECT_REF }}

      - name: Set exchange secrets (live trading, optional)
        env:
          BK: ${{ secrets.BYBIT_API_KEY }}
          BS: ${{ secrets.BYBIT_API_SECRET }}
          LT: ${{ vars.LIVE_TRADING }}
        run: |
          if [ -n "$BK" ] && [ -n "$BS" ]; then
            supabase secrets set BYBIT_API_KEY="$BK" BYBIT_API_SECRET="$BS" LIVE_TRADING="${LT:-0}" \
              --project-ref ${{ env.PROJECT_REF }}
            echo "exchange secrets set (LIVE_TRADING=${LT:-0})"
          else
            echo "no exchange keys — paper mode"
          fi

      - name: Verify complete handler before bundling
        run: |
          node --experimental-strip-types --check supabase/functions/trading-bot/index.ts
          grep -q 'Deno.serve' supabase/functions/trading-bot/index.ts

      - name: Prepare pinned local release shim
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          cp supabase/functions/trading-bot/index.ts supabase/functions/trading-bot/index.source.ts
          cat > supabase/functions/trading-bot/release-config.ts <<EOF
          const g = globalThis as any;
          g.__RELEASE_SHA = '${SHA}';
          g.__ENABLED_SLEEVES = 'Q15'; g.__SLEEVES_OFF = 'EVT,DONCH4H,FAST,ROTA,BLADE,PRO,LIST,FUND,CHAN,SCALP'; g.__LEVERAGE = '1'; g.__Q15_LEV = '25'; g.__Q15_PER_TRADE = '0.15'; g.__Q15_MAX_OPEN = '8'; g.__Q15_SHARE = '0.90'; g.__EVT_PER_TRADE = '0.15'; g.__EVT_MAX_OPEN = '8';
          g.__LEVERAGE = '1';
          g.__CHAN_LEV = '20';
          g.__CHAN_AGGRESSIVE = '1';
          try {
            Deno.env.set('ENABLED_SLEEVES', 'Q15');
            Deno.env.set('LEVERAGE', '1');
          } catch {}
          export {};
          EOF
          printf "import './release-config.ts';\nimport './index.source.ts';\n" > supabase/functions/trading-bot/index.ts
          echo "Prepared local static bundle for ${SHA}"

      - name: Deploy trading-bot function
        run: supabase functions deploy trading-bot --project-ref ${{ env.PROJECT_REF }} --no-verify-jwt

      - name: Activate owner-authorized DDDDD paper experiment once
        run: |
          jq -Rs '{query: .}' scripts/activate-ddddd-paper.sql > /tmp/ddddd-reset.json
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${{ env.PROJECT_REF }}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" \
            --data @/tmp/ddddd-reset.json > /tmp/ddddd-result.json
          jq -e 'type == "array"' /tmp/ddddd-result.json >/dev/null || { cat /tmp/ddddd-result.json; exit 1; }

      - name: Verify actual autonomous paper cycle after deploy
        # Verify in the database/cron region, independent of GitHub runner location.
        run: python3 scripts/smoke-paper-bot.py "https://${{ env.PROJECT_REF }}.supabase.co/functions/v1/trading-bot?forceFunctionRegion=eu-central-1"

      - name: Deploy observation-only flow collector
        run: |
          jq -Rs '{query: .}' supabase/migrations/20261005085327_flow_shadow.sql > /tmp/flow.json
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${{ env.PROJECT_REF }}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" \
            --data @/tmp/flow.json | jq -e 'type == "array"' || true
          supabase functions deploy flow-shadow --project-ref ${{ env.PROJECT_REF }} --no-verify-jwt || true

      - name: Deploy remaining functions
        run: |
          for fn in trading-optimizer market-regime-detector portfolio-rebalancer close-trade reset-account; do
            supabase functions deploy "$fn" --project-ref ${{ env.PROJECT_REF }} --no-verify-jwt || true
          done

      - name: Verify cron jobs
        run: |
          Q="select jobname, schedule from cron.job where jobname in ('trading-bot','data-collector') order by jobname"
          jq -n --arg q "$Q" '{query: $q}' > /tmp/q.json
          curl -s -X POST "https://api.supabase.com/v1/projects/${{ env.PROJECT_REF }}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" \
            --data @/tmp/q.json > /tmp/cron_result.json || true
          cat /tmp/cron_result.json; echo
          if ! grep -q '"trading-bot"' /tmp/cron_result.json; then
            echo "::error::the trading-bot cron row is missing"; exit 1
          fi
          echo "Cron rows present"

      - name: Done
        run: echo "Deploy complete"

