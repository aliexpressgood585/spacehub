name: DDDDD 3Y Full Scan
on:
  push:
    branches: ['research/ddddd-3y-20261008']
    paths:
      - 'scripts/edge-hunt/ddddd_3y_fullscan.py'
      - '.github/workflows/ddddd-3y-fullscan.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy numba
      - run: python -m py_compile scripts/edge-hunt/ddddd_3y_fullscan.py
      - run: python scripts/edge-hunt/ddddd_3y_fullscan.py
      - name: Record result
        run: |
          cp research-output/ddddd-3y-fullscan.json status/ddddd-3y-fullscan-research.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/ddddd-3y-fullscan-research.json
          git diff --cached --quiet || git commit -m "research: record 3y DDDDD scan [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ddddd-3y-fullscan
          path: research-output/
