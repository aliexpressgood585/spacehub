name: daytrade-desk
# "מאמן הדיי טריידינג": S1-S6 on 15m, PAPER desk ($5,000 demo), rules in shared/daytrade.ts, prices from OKX USDT swaps.
# LIVE LOOP: one job ~5h45m running scripts/daytrade-desk.ts every ~15 s, publishing daytrade/state.json to `pm-desk-data`.
# The hourly cron restarts it. Never places a real order.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
concurrency:
  group: daytrade-desk
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: live loop
        run: |
          mkdir -p /tmp/desk/scripts /tmp/desk/shared
          cp scripts/daytrade-desk.ts /tmp/desk/scripts/; cp shared/coach.ts shared/daytrade.ts shared/binperps.ts shared/universe.ts shared/strategy.ts /tmp/desk/shared/
          git config user.name pm-desk-bot
          git config user.email actions@github.com
          git fetch -q origin pm-desk-data || true
          if git rev-parse --verify origin/pm-desk-data >/dev/null 2>&1; then
            git checkout -q -B pm-desk-data origin/pm-desk-data
          else
            git checkout -q --orphan pm-desk-data && git rm -rf -q . && git clean -fdq
          fi
          mkdir -p daytrade
          end=$(( $(date +%s) + 345*60 )); last=0
          while [ $(date +%s) -lt $end ]; do
            t0=$(date +%s)
            timeout 120 node --experimental-strip-types /tmp/desk/scripts/daytrade-desk.ts daytrade/state.json || echo "cycle failed"
            if [ $(( t0 - last )) -ge 15 ]; then
              git add daytrade/state.json
              if git commit -q -m "daytrade desk state $(date -u +%FT%TZ)"; then
                git push -q origin pm-desk-data || { git pull -q --rebase -X ours origin pm-desk-data && git push -q origin pm-desk-data; } || true
              fi
              last=$t0
            fi
            s=$(( 15 - ($(date +%s) - t0) )); [ $s -gt 0 ] && sleep $s
          done
