name: Binance Futures DDDDD Full Scan
on:
  push:
    paths:
      - '.github/workflows/ddddd-fullscan.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scan every active USDT perpetual from Binance archive
        env:
