"ESPORTSUSDT","ESPUSDT","ETCUSDT","ETHFIUSDT","ETHUSDT","ETHWUSDT","EULUSDT","EVAAUSDT","FARTCOINUSDT","FETUSDT","FFUSDT","FHEUSDT","FIDAUSDT","FIGHTUSDT","FILUSDT","FLOCKUSDT","FLOWUSDT","FLUIDUSDT","FLUXUSDT","FOGOUSDT","FOLKSUSDT","FORMUSDT","FRAXUSDT","FUSDT","GALAUSDT","GASUSDT","GENIUSUSDT","GIGGLEUSDT","GLMUSDT","GMTUSDT","GMXUSDT","GOATUSDT","GPSUSDT","GRAMUSDT","GRASSUSDT","GRIFFAINUSDT","GRTUSDT","GRVTUSDT","GTCUSDT","GUAUSDT","GUNUSDT","GUSDT","GWEIUSDT","HAEDALUSDT","HANAUSDT","HBARUSDT","HEIUSDT","HEMIUSDT","HIVEUSDT","HMSTRUSDT","HOLOUSDT","HOMEUSDT","HOTUSDT","HUMAUSDT","HUSDT","HYPERUSDT","HYPEUSDT","ICNTUSDT","ICPUSDT","IDOLUSDT","IDUSDT","ILVUSDT","IMXUSDT","INITUSDT","INJUSDT","INUSDT","INXUSDT","IOSTUSDT","IOTAUSDT","IOTXUSDT","IOUSDT","IRYSUSDT","JASMYUSDT","JCTUSDT","JELLYJELLYUSDT","JOEUSDT","JSTUSDT","JTOUSDT","JUPUSDT","KAIAUSDT","KAITOUSDT","KASUSDT","KATUSDT","KAVAUSDT","KERNELUSDT","KGENUSDT","KITEUSDT","KMNOUSDT","KNCUSDT","KOMAUSDT","KSMUSDT","LABUSDT","LAUSDT","LAYERUSDT","LDOUSDT","LIGHTUSDT","LINEAUSDT","LINKUSDT","LISTAUSDT","LITUSDT","LPTUSDT","LQTYUSDT","LSKUSDT","LTCUSDT","LUMIAUSDT","LUNA2USDT","LYNUSDT","MAGICUSDT","MAGMAUSDT","MANAUSDT","MANTAUSDT","MANTRAUSDT","MARSCOINUSDT","MASKUSDT","MAVIAUSDT","MAVUSDT","MEGAUSDT","MELANIAUSDT","MEMEUSDT","MERLUSDT","METISUSDT","METUSDT","MEUSDT","MEWUSDT","MINAUSDT","MIRAUSDT","MITOUSDT","MMTUSDT","MOCAUSDT","MONUSDT","MOODENGUSDT","MORPHOUSDT","MOVEUSDT","MOVRUSDT","MTLUSDT","MUBARAKUSDT","MUSDT","MYXUSDT","NAORISUSDT","NEARUSDT","NEIROUSDT","NEOUSDT","NEWTUSDT","NIGHTUSDT","NILUSDT","NMRUSDT","NOMUSDT","NOTUSDT","NXPCUSDT","OGNUSDT","OGUSDT","ONDOUSDT","ONEUSDT","ONGUSDT","ONTUSDT","ONUSDT","OPENUSDT","OPGUSDT","OPNUSDT","OPUSDT","ORCAUSDT","ORDERUSDT","ORDIUSDT","OUSDT","PARTIUSDT","PAXGUSDT","PENDLEUSDT","PENGUUSDT","PEOPLEUSDT","PHAROSUSDT","PHAUSDT","PIEVERSEUSDT","PIPPINUSDT","PIXELUSDT","PLAYUSDT","PLUMEUSDT","PNUTUSDT","POLUSDT","POLYXUSDT","PONSUSDT","POPCATUSDT","PORTALUSDT","POWERUSDT","POWRUSDT","PRLUSDT","PROMUSDT","PROVEUSDT","PTBUSDT","PUMPUSDT","PUNDIXUSDT","PYTHUSDT","QNTUSDT","QTUMUSDT","QUSDT","RAREUSDT","RAVEUSDT","RAYSOLUSDT","RECALLUSDT","REDUSDT","RENDERUSDT","RESOLVUSDT","REUSDT","REZUSDT","RIFUSDT","RIVERUSDT","RLCUSDT","ROBOUSDT","RONINUSDT","ROSEUSDT","RPLUSDT","RSRUSDT","RUNEUSDT","RVNUSDT","SAFEUSDT","SAGAUSDT","SAHARAUSDT","SANDUSDT","SANTOSUSDT","SAPIENUSDT","SCRUSDT","SEIUSDT","SENTUSDT","SFPUSDT","SHELLUSDT","SIGNUSDT","SIRENUSDT","SKLUSDT","SKRUSDT","SKYAIUSDT","SKYUSDT","SLPUSDT","SLXUSDT","SNXUSDT","SOLUSDT","SOLVUSDT","SOMIUSDT","SONICUSDT","SOONUSDT","SOPHUSDT","SPACEUSDT","SPELLUSDT","SPKUSDT","SPORTFUNUSDT","SPXUSDT","SQDUSDT","SSVUSDT","STABLEUSDT","STARUSDT","STBLUSDT","STEEMUSDT","STOUSDT","STRKUSDT","STXUSDT","SUIUSDT","SUNUSDT","SUPERUSDT","SUSDT","SUSHIUSDT","SWARMSUSDT","SXTUSDT","SYNUSDT","SYRUPUSDT","TACUSDT","TAGUSDT","TAIKOUSDT","TAKEUSDT","TAOUSDT","TAUSDT","THETAUSDT","THEUSDT","TIAUSDT","TLMUSDT","TNSRUSDT","TOSHIUSDT","TOWNSUSDT","TRADOORUSDT","TRBUSDT","TREEUSDT","TRIAUSDT","TRUMPUSDT","TRUSTUSDT","TRUTHUSDT","TRXUSDT","TSTUSDT","TURBOUSDT","TURTLEUSDT","TUSDT","TUTUSDT","TWTUSDT","UAIUSDT","UBUSDT","UMAUSDT","UNIUSDT","USDCUSDT","USELESSUSDT","USTCUSDT","USUALUSDT","USUSDT","VANAUSDT","VELODROMEUSDT","VELVETUSDT","VETUSDT","VIRTUALUSDT","VTHOUSDT","VVVUSDT","WALUSDT","WAXPUSDT","WCTUSDT","WETUSDT","WIFUSDT","WLDUSDT","WLFIUSDT","WOOUSDT","WUSDT","XAIUSDT","XANUSDT","XAUTUSDT","XLMUSDT","XMRUSDT","XNYUSDT","XPINUSDT","XPLUSDT","XRPUSDT","XTZUSDT","XVGUSDT","XVSUSDT","YBUSDT","YFIUSDT","YGGUSDT","ZAMAUSDT","ZBTUSDT","ZECUSDT","ZENUSDT","ZEREBROUSDT","ZESTUSDT","ZETAUSDT","ZILUSDT","ZKCUSDT","ZKPUSDT","ZKUSDT","ZORAUSDT","ZROUSDT","ZRXUSDT","哈基米USDT","币安人生USDT","我踏马来了USDT","牛来USDT","龙虾USDT"]'
        run: |
          mkdir -p status
          python3 - <<'PY'
          import csv, io, json, os, urllib.request, zipfile, concurrent.futures
          from datetime import datetime, timezone, timedelta

          symbols=json.loads(os.environ['SYMBOLS_JSON'])
          end_date=datetime(2026,10,6,tzinfo=timezone.utc).date()
          start_dt=datetime(2026,9,6,tzinfo=timezone.utc)
          end_dt=datetime(2026,10,6,tzinfo=timezone.utc)
          start_ms=int(start_dt.timestamp()*1000); end_ms=int(end_dt.timestamp()*1000)
          base='https://data.binance.vision/data/futures/um'
          UA={'User-Agent':'spacehub-ddddd-fullscan/2.0'}

          def load_zip(url):
              try:
                  req=urllib.request.Request(url,headers=UA)
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read()
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      name=z.namelist()[0]
                      txt=z.read(name).decode('utf-8')
                  rows=[]
                  for row in csv.reader(io.StringIO(txt)):
                      if not row or not row[0].isdigit(): continue
                      t=int(row[0])
                      if start_ms <= t < end_ms: rows.append(row)
                  return rows
              except Exception:
                  return []

          def scan_symbol(sym):
              urls=[
                f'{base}/monthly/klines/{sym}/5m/{sym}-5m-2026-09.zip',
                f'{base}/daily/klines/{sym}/5m/{sym}-5m-2026-10-01.zip',
                f'{base}/daily/klines/{sym}/5m/{sym}-5m-2026-10-02.zip',
                f'{base}/daily/klines/{sym}/5m/{sym}-5m-2026-10-03.zip',
                f'{base}/daily/klines/{sym}/5m/{sym}-5m-2026-10-04.zip',
                f'{base}/daily/klines/{sym}/5m/{sym}-5m-2026-10-05.zip'
              ]
              rows=[]
              for u in urls: rows.extend(load_zip(u))
              rows.sort(key=lambda r:int(r[0]))
              ded=[]; seen=set()
              for r in rows:
                  t=int(r[0])
                  if t in seen: continue
                  seen.add(t); ded.append(r)
              n=w=l=amb=0; gross=0.0
              for i in range(5,len(ded)):
                  prev=ded[i-5:i]
                  if not all(float(x[4])<float(x[1]) for x in prev): continue
                  entry=float(ded[i-1][4]); tp=entry*1.01; sl=entry*0.99
                  n+=1; result=None
                  for j in range(i,len(ded)):
                      hi=float(ded[j][2]); lo=float(ded[j][3])
                      if lo<=sl and hi>=tp:
                          amb+=1; result='L'; break
                      if lo<=sl: result='L'; break
                      if hi>=tp: result='W'; break
                  if result=='W': w+=1; gross+=0.01
                  else: l+=1; gross-=0.01
              wr=100*w/n if n else 0.0
              net=(gross-n*0.001)*100
              return {'symbol':sym,'bars':len(ded),'signals':n,'wins':w,'losses':l,'win_rate':round(wr,2),'net_unlevered_pct_sum':round(net,3),'ambiguous_bars':amb}

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
              futs={ex.submit(scan_symbol,s):s for s in symbols}
              for k,f in enumerate(concurrent.futures.as_completed(futs),1):
                  r=f.result(); results.append(r)
                  if k%25==0 or k==len(symbols):
                      print(f'progress {k}/{len(symbols)}',flush=True)

          ranked=sorted(results,key=lambda x:(x['win_rate'],x['signals']),reverse=True)
          qualified=[r for r in ranked if r['signals']>=20 and r['win_rate']>=75 and r['net_unlevered_pct_sum']>0]
          q10=[r for r in ranked if r['signals']>=10 and r['win_rate']>=75 and r['net_unlevered_pct_sum']>0]
          strong=[r for r in ranked if r['signals']>=20 and r['win_rate']>=65 and r['net_unlevered_pct_sum']>0]
          report={'generated_at':datetime.now(timezone.utc).isoformat(),'window':'2026-09-06 through 2026-10-05 UTC','symbols_total':len(symbols),'symbols_scanned':len(results),'strategy':'5 red 5m candles -> LONG, TP +1%, SL -1%; conservative same-bar conflict; approx 0.10% round-trip taker fees','qualified_75_min20':qualified,'qualified_75_min10':q10,'strong_65_min20':strong,'all':ranked}
          json.dump(report,open('status/ddddd-binance-fullscan.json','w'),indent=2,ensure_ascii=False)
          with open('status/ddddd-binance-fullscan.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['symbol','signals','wins','losses','win_rate','net_unlevered_pct_sum','bars','ambiguous_bars'])
              w.writeheader();w.writerows(ranked)
          print('SCANNED',len(results),'OF',len(symbols))
          print('QUALIFIED75_MIN20',json.dumps(qualified[:100],ensure_ascii=False))
          print('QUALIFIED75_MIN10',json.dumps(q10[:100],ensure_ascii=False))
          print('TOP20',json.dumps(ranked[:20],ensure_ascii=False))
          PY
      - name: Commit results
        run: |
          git config user.name "fullscan-bot"
          git config user.email "actions@github.com"
          git add status/ddddd-binance-fullscan.json status/ddddd-binance-fullscan.csv
          git commit -m "status: full Binance Futures DDDDD scan [skip ci]" || true
          git pull --rebase origin main || true
          git push || true
