name: DDDDD Three Hypotheses 3Y
on:
  push:
    branches: ['research/three-hypotheses-20261007']
    paths: ['scripts/market-gate-check/three_hypotheses.py', 'scripts/market-gate-check/check_hypotheses.py', '.github/workflows/three-hypotheses-3y.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy numba
      - run: python scripts/market-gate-check/check_hypotheses.py
      - run: python scripts/market-gate-check/three_hypotheses.py
      - uses: actions/upload-artifact@v4
        with:
          name: three-hypotheses-3y
          path: research-output/
