name: Quarter-Hour Order-Flow Hunt 3Y
on:
  push:
    branches: ['research/edge-hunt-20261007']
    paths:
      - 'scripts/edge-hunt/quarter_hour_flow.py'
      - '.github/workflows/quarter-hour-flow-3y.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy numba
      - run: python -m py_compile scripts/edge-hunt/quarter_hour_flow.py
      - run: python scripts/edge-hunt/quarter_hour_flow.py
      - name: Record result
        run: |
          mkdir -p status
          cp research-output/quarter-hour-flow-3y.json status/quarter-hour-flow-3y-research.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/quarter-hour-flow-3y-research.json
          git diff --cached --quiet || git commit -m "research: record quarter-hour flow hunt [skip ci]"
          git pull --rebase origin research/edge-hunt-20261007
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: quarter-hour-flow-3y
          path: research-output/
