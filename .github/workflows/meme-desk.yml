name: meme-desk
# "ממים חיים": PAPER desk for new pump.fun meme coins ($1,000 demo on live bonding-curve prices). LIVE LOOP ~5h45m, runs
# scripts/meme-desk.ts every ~10 s and publishes meme/state.json to the `pm-desk-data` branch. Never sends a transaction.
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
concurrency:
  group: meme-desk
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: live loop
        run: |
          mkdir -p /tmp/desk/scripts /tmp/desk/shared
          cp scripts/meme-desk.ts scripts/meme-core.ts scripts/meme-feed.ts /tmp/desk/scripts/; cp shared/meme.ts shared/solana.ts /tmp/desk/shared/
          git config user.name pm-desk-bot
          git config user.email actions@github.com
          git fetch -q origin pm-desk-data || true
          if git rev-parse --verify origin/pm-desk-data >/dev/null 2>&1; then
            git checkout -q -B pm-desk-data origin/pm-desk-data
          else
            git checkout -q --orphan pm-desk-data && git rm -rf -q . && git clean -fdq
          fi
          mkdir -p meme
          # pump.fun's API refuses GitHub runners (403): coins come from the free PumpPortal websocket + Solana RPC feed,
          # a background process that writes /tmp/meme-feed.json every second (restarted if it dies)
          export MEME_FEED=/tmp/meme-feed.json
          feed() { node --experimental-strip-types /tmp/desk/scripts/meme-feed.ts /tmp/meme-feed.json meme/state.json > /tmp/meme-feed.log 2>&1 & echo $! > /tmp/meme-feed.pid; }
          feed; sleep 20
          end=$(( $(date +%s) + 345*60 )); last=0
          while [ $(date +%s) -lt $end ]; do
            t0=$(date +%s)
            # the always-on Fly server owns the desk once it answers; this runner then stands down
            if curl -fsS -m 5 https://spacehub-meme.fly.dev/health >/dev/null 2>&1; then echo "fly server is live - standing down"; break; fi
            kill -0 $(cat /tmp/meme-feed.pid) 2>/dev/null || { echo "feed died - restarting"; tail -5 /tmp/meme-feed.log; feed; sleep 10; }
            timeout 120 node --experimental-strip-types /tmp/desk/scripts/meme-desk.ts meme/state.json || echo "cycle failed"
            if [ $(( t0 - last )) -ge 10 ]; then
              git add meme/
              if git commit -q -m "meme desk state $(date -u +%FT%TZ)"; then
                git push -q origin pm-desk-data || { git pull -q --rebase -X ours origin pm-desk-data && git push -q origin pm-desk-data; } || true
              fi
              last=$t0
            fi
            s=$(( 3 - ($(date +%s) - t0) )); [ $s -gt 0 ] && sleep $s
          done
