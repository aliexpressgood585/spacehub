name: Volatility Short Regime 3Y
on:
  push:
    branches: ['research/vol-short-regime-20261007']
    paths:
      - 'scripts/market-gate-check/vol_short_regime.py'
      - '.github/workflows/vol-short-regime-3y.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy numba
      - run: python -m py_compile scripts/market-gate-check/vol_short_regime.py
      - run: python scripts/market-gate-check/vol_short_regime.py
      - name: Record regime result
        run: |
          cp research-output/vol-short-regime-3y.json status/vol-short-regime-3y-research.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/vol-short-regime-3y-research.json
          git diff --cached --quiet || git commit -m "research: record volatility short regime result [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: vol-short-regime-3y
          path: research-output/
