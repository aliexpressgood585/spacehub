        run: |
          mkdir -p status
          python3 - <<'PY'
          import csv,io,json,os,urllib.request,zipfile,concurrent.futures
          from datetime import datetime,timezone
          syms=json.loads(os.environ['SYMBOLS_JSON'])
          START=int(datetime(2026,9,6,tzinfo=timezone.utc).timestamp()*1000)
          END=int(datetime(2026,10,6,tzinfo=timezone.utc).timestamp()*1000)
          BASE='https://data.binance.vision/data/futures/um'; UA={'User-Agent':'spacehub-falling5/1.0'}
          def zr(url):
           try:
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=25) as r: raw=r.read()
            with zipfile.ZipFile(io.BytesIO(raw)) as z: txt=z.read(z.namelist()[0]).decode()
            return [r for r in csv.reader(io.StringIO(txt)) if r and r[0].isdigit() and START<=int(r[0])<END]
           except:return []
          def scan(sym):
           urls=[f'{BASE}/monthly/klines/{sym}/5m/{sym}-5m-2026-09.zip']+[f'{BASE}/daily/klines/{sym}/5m/{sym}-5m-2026-10-0{d}.zip' for d in range(1,6)]
           a=[]
           for u in urls:a+=zr(u)
           a.sort(key=lambda r:int(r[0])); seen=set(); b=[]
           for r in a:
            t=int(r[0])
            if t not in seen:seen.add(t);b.append(r)
           def bt(mode):
            n=w=l=0
            for i in range(5,len(b)):
             p=b[i-5:i]
             ok=all(float(z[4])<float(z[1]) for z in p) if mode=='red' else all(float(p[k][4])>float(p[k+1][4]) for k in range(4))
             if not ok:continue
             e=float(p[-1][4]);tp=e*1.01;sl=e*.99;n+=1;res='L'
             for z in b[i:]:
              hi=float(z[2]);lo=float(z[3])
              if lo<=sl:res='L';break
              if hi>=tp:res='W';break
             if res=='W':w+=1
             else:l+=1
            return {'n':n,'w':w,'l':l,'wr':round(100*w/n,2) if n else 0}
           return {'symbol':sym,'red':bt('red'),'falling':bt('falling')}
          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
           for k,r in enumerate(ex.map(scan,syms),1):
            out.append(r)
            if k%50==0:print('progress',k,flush=True)
          def agg(key,cut=0):
           rows=[r for r in out if r[key]['n']>=20 and r[key]['wr']>=cut]
           return {'coins':len(rows),'signals':sum(r[key]['n'] for r in rows),'wins':sum(r[key]['w'] for r in rows),'wr_weighted':round(100*sum(r[key]['w'] for r in rows)/max(1,sum(r[key]['n'] for r in rows)),2)}
          report={'window':'2026-09-06 through 2026-10-05 UTC','symbols':len(out),'red_60plus':agg('red',60),'falling_60plus':agg('falling',60),'red_65plus':agg('red',65),'falling_65plus':agg('falling',65),'falling_top':sorted([{'symbol':r['symbol'],**r['falling']} for r in out],key=lambda z:(z['wr'],z['n']),reverse=True)[:100],'all':out}
          json.dump(report,open('status/five-falling-scan.json','w'),indent=2)
          print(json.dumps({k:report[k] for k in ['red_60plus','falling_60plus','red_65plus','falling_65plus']}))
          print('TOP',json.dumps(report['falling_top'][:20]))
          PY
      - name: Commit
        run: |
          git config user.name 'falling5-bot'; git config user.email 'actions@github.com'
          git add status/five-falling-scan.json
          git commit -m 'status: compare five falling closes [skip ci]' || true
          git pull --rebase origin main || true
          git push || true