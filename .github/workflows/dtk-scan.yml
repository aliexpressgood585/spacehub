name: dtk-scan
# "ערכת הדיי טריידר" scanner (scripts/dtk-scan.ts): every USDT perpetual Binance Futures trades (priced from OKX), setups once per
# closed 5m bar, time machine for the strongest, funding / OI / liquidations, crypto news. LIVE LOOP: one job ~5h48m, a cycle
# about every 30 s, dtk/state.json pushed to its own `dtk-data` branch. NO GAPS: 3 minutes before the end the job dispatches its
# successor, which waits in the concurrency queue and starts the moment this one ends; the hourly cron is only a backup.
# Read-only toward exchanges: no real orders.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: dtk-scan
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: live loop
        env:
          GH_TOKEN: ${{ github.token }}
          # optional: Claude scores the news (era 3); without it the demo uses the keyword scorer. Never printed, never stored.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p /tmp/desk/scripts /tmp/desk/shared
          # news scorers: FinBERT (free, local, transformers.js) always; the Anthropic SDK only when the secret exists
          pk="@huggingface/transformers@4.3.1"; [ -n "$ANTHROPIC_API_KEY" ] && pk="$pk @anthropic-ai/sdk@0.133.0"
          (cd /tmp/desk && npm i -s --no-save --no-audit --no-fund $pk) || echo "npm install failed: event-rule scorer only"
          cp scripts/dtk-scan.ts scripts/dtk-news-claude.ts scripts/dtk-news-finbert.ts /tmp/desk/scripts/; cp shared/dtk.ts shared/binperps.ts shared/universe.ts shared/strategy.ts /tmp/desk/shared/
          git config user.name dtk-bot
          git config user.email actions@github.com
          git fetch -q --depth=1 origin dtk-data || true
          if git rev-parse --verify origin/dtk-data >/dev/null 2>&1; then
            git checkout -q -B dtk-data origin/dtk-data
          else
            git checkout -q --orphan dtk-data && git rm -rf -q . && git clean -fdq
          fi
          mkdir -p dtk
          end=$(( $(date +%s) + 348*60 )); handed=0
          while [ $(date +%s) -lt $end ]; do
            if [ $handed = 0 ] && [ $(( end - $(date +%s) )) -lt 180 ]; then
              gh workflow run dtk-scan.yml --ref main -R "$GITHUB_REPOSITORY" && handed=1 || echo "handover dispatch failed"
            fi
            t0=$(date +%s)
            timeout 170 node --experimental-strip-types /tmp/desk/scripts/dtk-scan.ts dtk/state.json || echo "cycle failed"
            [ -f dtk/state.json ] && git add dtk/state.json; ls dtk/state-v*.json >/dev/null 2>&1 && git add dtk/state-v*.json
            if git commit -q -m "dtk state $(date -u +%FT%TZ)"; then
              git push -q origin dtk-data || true
            fi
            s=$(( 30 - ($(date +%s) - t0) )); [ $s -gt 0 ] && sleep $s
          done
