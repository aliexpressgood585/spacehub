name: dtk-scan
# "ערכת הדיי טריידר" scanner (scripts/dtk-scan.ts): every USDT perpetual Binance Futures trades (priced from OKX), setups once per
# closed 5m bar, time machine for the strongest, funding / OI / liquidations, crypto news. LIVE LOOP: one job ~5h45m, a cycle
# about every 60 s, dtk/state.json pushed to its own `dtk-data` branch; the hourly cron restarts the loop. Read-only: no orders.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: dtk-scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: live loop
        run: |
          mkdir -p /tmp/desk/scripts /tmp/desk/shared
          cp scripts/dtk-scan.ts /tmp/desk/scripts/; cp shared/dtk.ts shared/binperps.ts shared/universe.ts shared/strategy.ts /tmp/desk/shared/
          git config user.name dtk-bot
          git config user.email actions@github.com
          git fetch -q --depth=1 origin dtk-data || true
          if git rev-parse --verify origin/dtk-data >/dev/null 2>&1; then
            git checkout -q -B dtk-data origin/dtk-data
          else
            git checkout -q --orphan dtk-data && git rm -rf -q . && git clean -fdq
          fi
          mkdir -p dtk
          end=$(( $(date +%s) + 345*60 ))
          while [ $(date +%s) -lt $end ]; do
            t0=$(date +%s)
            timeout 170 node --experimental-strip-types /tmp/desk/scripts/dtk-scan.ts dtk/state.json || echo "cycle failed"
            [ -f dtk/state.json ] && git add dtk/state.json
            if git commit -q -m "dtk state $(date -u +%FT%TZ)"; then
              git push -q origin dtk-data || true
            fi
            s=$(( 60 - ($(date +%s) - t0) )); [ $s -gt 0 ] && sleep $s
          done
