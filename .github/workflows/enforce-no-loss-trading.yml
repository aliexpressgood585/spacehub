name: Enforce CHAN Paper Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enforce-no-loss-trading.yml'
  workflow_run:
    workflows: ['Deploy Edge Function']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: enforce-chan-paper-runtime
  cancel-in-progress: true

env:
  PROJECT_REF: adxgadwghgkwmntsnrar

jobs:
  deploy-chan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Login to Supabase
        run: supabase login --token '${{ secrets.SUPABASE_ACCESS_TOKEN }}'

      - name: Apply BLADE ledger migration (v101.0, idempotent)
        run: |
          jq -Rs '{query: .}' supabase/migrations/20261004090000_blade_sleeve.sql > /tmp/blade_mig.json
          curl -s -X POST "https://api.supabase.com/v1/projects/${{ env.PROJECT_REF }}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" \
            --data @/tmp/blade_mig.json | tee /tmp/blade_mig_result.json
          if grep -q '"error"\|"message"' /tmp/blade_mig_result.json; then echo "::error::BLADE migration failed"; cat /tmp/blade_mig_result.json; exit 1; fi
          echo "BLADE migration applied"

      - name: Apply P-AGG2 ledger migration (owner 2026-10-04, idempotent; after the BLADE ledger, which it extends)
        run: |
          jq -Rs '{query: .}' supabase/migrations/20261004120000_agg2.sql > /tmp/agg2_mig.json
          curl -s -X POST "https://api.supabase.com/v1/projects/${{ env.PROJECT_REF }}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" \
            --data @/tmp/agg2_mig.json | tee /tmp/agg2_mig_result.json
          if grep -q '"error"\|"message"' /tmp/agg2_mig_result.json; then echo "::error::P-AGG2 migration failed"; cat /tmp/agg2_mig_result.json; exit 1; fi
          echo "P-AGG2 migration applied"

      - name: Apply P-Q15 ledger migration (owner 2026-10-04, idempotent; after the BLADE ledger, which it extends)
        run: |
          jq -Rs '{query: .}' supabase/migrations/20261004120001_q15_sleeve.sql > /tmp/q15_mig.json
          curl -s -X POST "https://api.supabase.com/v1/projects/${{ env.PROJECT_REF }}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" \
            --data @/tmp/q15_mig.json | tee /tmp/q15_mig_result.json
          if grep -q '"error"\|"message"' /tmp/q15_mig_result.json; then echo "::error::P-Q15 migration failed"; cat /tmp/q15_mig_result.json; exit 1; fi
          echo "P-Q15 migration applied"

      - name: Verify complete handler before bundling
        run: |
          node --experimental-strip-types --check supabase/functions/trading-bot/index.ts
          grep -q 'Deno.serve' supabase/functions/trading-bot/index.ts
          if grep -q 'Warning: truncated output' supabase/functions/trading-bot/index.ts; then exit 1; fi

      - name: Prepare pinned local release shim
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          cp supabase/functions/trading-bot/index.ts supabase/functions/trading-bot/index.source.ts
          cat > supabase/functions/trading-bot/release-config.ts <<EOF
          const g = globalThis as any;
          g.__RELEASE_SHA = '${SHA}';
          g.__ENABLED_SLEEVES = 'Q15,EVT,DONCH4H'; g.__SLEEVES_OFF = ''; g.__LEVERAGE = '1'; g.__Q15_LEV = '10'; g.__Q15_PER_TRADE = '0.05'; g.__Q15_MAX_OPEN = '8'; g.__Q15_SHARE = '0.50'; g.__EVT_PER_TRADE = '0.08'; g.__EVT_MAX_OPEN = '3'; // P-Q15 owner 2026-10-04. Rollback = previous shim; close Q15 rows first.
          g.__LEVERAGE = '1';
          g.__CHAN_LEV = '20'; // v98.1 paper leverage for new CHAN entries (1..50)
          g.__CHAN_AGGRESSIVE = '1'; // v98.0 owner override (paper only); remove to roll back
          try {
            Deno.env.set('ENABLED_SLEEVES', 'Q15,EVT,DONCH4H');
            Deno.env.set('LEVERAGE', '1');
          } catch {}
          export {};
          EOF
          printf "import './release-config.ts';\nimport './index.source.ts';\n" > supabase/functions/trading-bot/index.ts
          echo "Prepared local static bundle for ${SHA}"

      - name: Deploy CHAN paper bot
        run: supabase functions deploy trading-bot --project-ref '${{ env.PROJECT_REF }}' --no-verify-jwt

      - name: Verify no-loss CHAN source settings
        run: |
          grep -q "dailyLoss: Infinity" shared/chan.ts
          grep -q "maxConsec: Infinity" shared/chan.ts
          grep -q "maxOpen: Infinity" shared/chan.ts
          echo 'CHAN no daily/streak/open-count stop verified'
