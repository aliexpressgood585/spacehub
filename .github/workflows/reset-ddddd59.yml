name: Reset DDDDD 59 Paper Account
on:
  push:
    paths:
      - '.github/workflows/reset-ddddd59.yml'
permissions:
  contents: read
env:
  PROJECT_REF: adxgadwghgkwmntsnrar
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset paper account once
        run: |
          cat >/tmp/reset.json <<'JSON'
          {"query":"DO $reset$ BEGIN PERFORM pg_advisory_xact_lock(7151591); PERFORM id FROM public.bot_state WHERE id=1 FOR UPDATE; IF NOT EXISTS(SELECT 1 FROM public.bot_state WHERE id=1 AND paper_mode=true) THEN RAISE EXCEPTION 'paper account required'; END IF; IF EXISTS(SELECT 1 FROM public.paper_reset_archive WHERE run_key='DDDDD-59-20261006') THEN RETURN; END IF; INSERT INTO public.paper_reset_archive SELECT 'DDDDD-59-20261006','bot_state',to_jsonb(t),now() FROM public.bot_state t WHERE id=1; INSERT INTO public.paper_reset_archive SELECT 'DDDDD-59-20261006','bot_trades',to_jsonb(t),now() FROM public.bot_trades t; INSERT INTO public.paper_reset_archive SELECT 'DDDDD-59-20261006','bot_trade_snapshots',to_jsonb(t),now() FROM public.bot_trade_snapshots t; INSERT INTO public.paper_reset_archive SELECT 'DDDDD-59-20261006','bot_equity',to_jsonb(t),now() FROM public.bot_equity t; DELETE FROM public.bot_trade_snapshots; DELETE FROM public.bot_trades; DELETE FROM public.bot_equity; UPDATE public.bot_state SET balance=5000,peak_balance=5000,day_start_balance=5000,day_date=(now() at time zone 'UTC')::date,hard_halt_reason=null,active=true,paper_mode=true,hard_halt_at=null,lock_until=null,updated_at=now(),trade_count=0,streak=0,overall_wr=0,overall_pf=1,bot_params=jsonb_build_object('paper_strategy','DDDDD','daily_loss_halt_enabled',false,'reset_at',now(),'initial_balance',5000,'universe_mode','DDDDD_TOP59_60PLUS','vwap_rev_enabled',false),coin_weights='{}'::jsonb WHERE id=1; INSERT INTO public.bot_equity(equity,balance,exposure) VALUES(5000,5000,0); END $reset$;"}
          JSON
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" --data @/tmp/reset.json
      - name: Verify reset
        run: |
          cat >/tmp/q.json <<'JSON'
          {"query":"SELECT balance,peak_balance,active,paper_mode,trade_count,bot_params FROM bot_state WHERE id=1;"}
          JSON
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" --data @/tmp/q.json