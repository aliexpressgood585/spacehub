name: BTC Lag Pairs 3Y Research
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/market-gate-check/btc_lag_pairs.py'
      - 'scripts/market-gate-check/check_btc_lag_pairs.py'
      - 'quant/PREREGISTRATION_BTC_LAG.md'
      - '.github/workflows/btc-lag-pairs-3y.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==2.1.3
      - working-directory: scripts/market-gate-check
        run: python check_btc_lag_pairs.py
      - working-directory: scripts/market-gate-check
        run: python btc_lag_pairs.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-lag-pairs-3y
          path: scripts/market-gate-check/research-output/btc-lag-pairs-3y.json
          retention-days: 30
